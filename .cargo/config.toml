[build]
# Shares compiled dependencies across worktrees; SCCACHE_DIR selects the cache location.
rustc-wrapper = "sccache"

# wasm32 is the browser: its tests run in a headless browser through the
# pinned wasm-bindgen-test-runner, never one first on PATH; scripts/wasm-runner
# picks Firefox or Playwright's Chromium.
[target.wasm32-unknown-unknown]
runner = "scripts/wasm-runner"
# Browsers name frames from the name section, not DWARF, which was two thirds
# of a test binary (160 of rocky-secure's 234 MB): every run of a binary
# transforms and loads all of it.
# Unoptimized workspace crates poll futures deeper than wasm's default 1 MiB
# stack, which overflows into linear memory, so test binaries link a larger one.
rustflags = ["-C", "debuginfo=0", "-C", "link-arg=-zstack-size=16777216"]

[env]
# Unoptimized workspace crates poll deep futures on test and harness threads
# too, which std starts with 2 MiB stacks unless told otherwise.
RUST_MIN_STACK = "16777216"
# C dependencies of wasm32 (SQLite, ring) archive with the toolchain's llvm-ar.
AR_wasm32_unknown_unknown = { value = "scripts/llvm-ar", relative = true }
# Browser tests run in a dedicated Worker, where a node runs (OPFS needs it).
WASM_BINDGEN_USE_DEDICATED_WORKER = "1"
# Tests never apply a pending browser update, which can wait for a prompt.
MOZ_DISABLE_UPDATE_PROCESSING = "1"

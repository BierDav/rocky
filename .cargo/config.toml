[build]
# Shares compiled dependencies across worktrees; SCCACHE_DIR selects the cache location.
rustc-wrapper = "sccache"

[profile.test.package.rocky-core]
opt-level = 3
[profile.test.package.rocky-credentials]
opt-level = 3
[profile.test.package.rocky-storage]
opt-level = 3
[profile.test.package.rocky-runtime]
opt-level = 3
[profile.test.package.rocky-sdk]
opt-level = 3

# wasm32 is the browser: its tests run in headless Firefox (scripts/tools
# installs the runner and geckodriver into local/bin).
[target.wasm32-unknown-unknown]
runner = "wasm-bindgen-test-runner"

[env]
# C dependencies of wasm32 (SQLite, ring) archive with the toolchain's llvm-ar.
AR_wasm32_unknown_unknown = { value = "scripts/llvm-ar", relative = true }
# Browser tests run in a dedicated Worker, where a node runs (OPFS needs it).
WASM_BINDGEN_USE_DEDICATED_WORKER = "1"
# Tests never apply a pending browser update, which can wait for a prompt.
MOZ_DISABLE_UPDATE_PROCESSING = "1"

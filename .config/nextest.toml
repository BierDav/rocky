# Test runner settings; see docs/development.md#test-tiers.

# A test run outside the tier checks is reported slow after 30 s and
# terminated after 60 s.
[profile.default]
slow-timeout = { period = "30s", terminate-after = 2 }

# The probe asserts fsync latency, which parallel tests would distort. It runs
# first, alone, rather than waiting for every running test to finish.
[[profile.default.overrides]]
filter = 'package(rocky-coordinator) & test(/^raft_store::probe::/)'
threads-required = "num-test-threads"
priority = 100
slow-timeout = { period = "60s", terminate-after = 10 }

# The soak tests confirm thousands of commands in the e2e tier; the longest,
# they start first.
[[profile.default.overrides]]
filter = 'test(/::soak_/)'
priority = 90
slow-timeout = { period = "60s", terminate-after = 30 }

# The tiers' profiles; scripts/test-tiers judges their budgets from the JUnit
# reports. The limits here only stop a test that hung or is far over budget.
[profile.integration]
fail-fast = false
slow-timeout = { period = "10s", terminate-after = 3 }

[profile.integration.junit]
path = "junit.xml"

[profile.e2e]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10 }

[profile.e2e.junit]
path = "junit.xml"

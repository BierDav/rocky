# Test runner settings; see docs/development.md#test-tiers.

# A test run outside the tier checks is reported slow after 30 s and
# terminated after 60 s.
[profile.default]
slow-timeout = { period = "30s", terminate-after = 2 }

# The soak tests confirm thousands of commands in the e2e tier; the longest,
# they start first.
[[profile.default.overrides]]
filter = 'test(/::soak_/)'
priority = 90
slow-timeout = { period = "60s", terminate-after = 30 }

# The simulation sweep's shards each run dozens of seeded schedules.
[[profile.default.overrides]]
filter = 'package(rocky-sdk) & test(/^simulation::tests::sweep_/)'
priority = 89
slow-timeout = { period = "60s", terminate-after = 20 }

# Stop hung tests; elapsed time is otherwise diagnostic only.
[profile.integration]
fail-fast = false
slow-timeout = { period = "10s", terminate-after = 3 }

[profile.integration.junit]
path = "junit.xml"

[profile.e2e]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10 }

[profile.e2e.junit]
path = "junit.xml"


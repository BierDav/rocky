# Correctness test selection. Timing is diagnostic, never a pass/fail budget.

[unit]

[integration]
# The capture subscriber has process-wide callsite state.
isolated-filter = 'package(=rocky-secure) & test(=replica::lock::tests::slow_holds_report_the_request_site_and_class)'
filter = '''
kind(test)
    | (package(rocky-secure) & test(=replica::lock::tests::slow_holds_report_the_request_site_and_class))
    | (package(rocky-secure) & test(/^replica::checkpoint::backend_vectors::/))
    | (package(rocky-secure) & test(/^tests::/))
    | (package(rocky-secure) & test(/^network::(holdings|contacts)::tests::/))
    | (package(rocky-secure) & test(/^network::link::integration_tests::/))
    | (package(rocky-secure) & test(/^network::budgets::/))
    | (package(rocky-coordinator) & test(/^(client::tests|database::tests|native_tests|machine::public_tests)::/))
    | (package(rocky-voter) & test(/^raft_store::tests::/))
    | (package(rocky-sdk) & test(/^(database|enrollment|mesh|node|simulation)::/))
    | (package(rocky-storage) & test(/^(cursor|database|sqlite)::tests::/))
    | (package(rocky-credentials) & (test(/^keys::tests::/) | test(=revocation::tests::every_interleaving_of_merges_yields_one_digest)))
'''

[e2e]
filter = '''
(package(rocky-secure) & test(/^tests::partitions::replayed::convergence::seeded_schedule_sweep/))
    | (package(rocky-secure) & test(/^tests::replayed_constraints::convergence::/))
    | (package(rocky-sdk) & test(/^node::delivery_tests::(a_crash_|a_mailbox_refuses_at_both_bounds)/))
    | test(/::soak_/)
    | (package(rocky-sdk) & test(/^simulation::tests::sweep_/))
    | (binary_id(rocky-voter) & (
          test(=raft_store::tests::openraft_storage_contract)
    ))
    | (binary_id(rocky-voter::integration) & (
          test(=cluster::three_persistent_voters_keep_controls_and_counters_across_restarts)
        | test(=cluster::crashes_at_log_commit_apply_reply_and_snapshot_boundaries)
        | test(=cluster::three_persistent_voters_fence_recover_and_verify_offline)
    ))
    | (binary_id(rocky-voter::integration) & (
          test(=public::a_completely_restored_service_stays_fenced)
        | test(=public::outages_and_restarts_keep_state_and_restore_is_fenced)
    ))
    | (binary_id(rocky-sdk::integration) & (
          test(=bootstrap::join_restores_large_rows_across_checkpoint_pages)
    ))
    | (binary_id(rocky-sdk::integration) & (
          test(=composition::a_closing_service_cancels_work_that_outlasts_its_drain)
    ))
    | (binary_id(rocky-iroh::integration) & (
          test(=discovery::members_of_a_topic_find_each_other_over_mdns_and_others_do_not)
    ))
    | (binary_id(rocky-sdk::integration) & (
          test(=discovery::two_processes_find_each_other_over_mdns_and_converge)
        | test(=discovery::two_processes_find_each_other_through_the_rendezvous_record_and_converge)
    ))
    | (binary_id(rocky-sdk::integration) & (
          test(=driver::bundle_limits_and_the_lease_fail_the_transaction_without_splitting_it)
    ))
    | (binary_id(rocky-sdk::integration) & (
          test(=engine::devices_converge_over_iroh)
    ))
    | (binary_id(rocky-sdk::integration) & (
          test(=faults::a_cut_stream_loses_nothing_and_applies_nothing_in_part)
        | test(=faults::a_slow_reader_holds_the_writer_back_without_loss)
        | test(=faults::inbound_streams_over_budget_are_dropped_and_served_again_later)
    ))
    | (binary_id(rocky-sdk::integration) & (
          test(=migrations::returning_member_uses_the_newest_checkpoint_across_migration_bundles)
    ))
    | (binary_id(rocky-sdk::integration) & (
          test(=group_secrets::an_interrupted_rotation_resumes_to_one_epoch_across_the_group)
    ))
    | (binary_id(rocky-sdk::integration) & (
          test(=issuers::a_second_issuer_carries_the_domain_after_the_creator_is_lost)
        | test(=issuers::a_compromised_creator_ends_its_early_enrollee_by_cascade)
    ))
    | (binary_id(rocky-sdk::integration) & (
          test(=registry::a_full_registry_refuses_the_257th_device_and_syncs_to_a_new_issuer)
    ))
    | (binary_id(rocky-sdk::integration) & (
          test(=revocations::partitioned_issuers_revocations_merge_when_a_syncs_first)
        | test(=revocations::partitioned_issuers_revocations_merge_when_b_syncs_first)
        | test(=revocations::conflicting_root_modes_merge_when_lost_syncs_first)
        | test(=revocations::conflicting_root_modes_merge_when_compromised_syncs_first)
    ))
    | (binary_id(rocky-sdk::integration) & (
          test(=service::a_registered_service_domain_commits_ordinary_rows_and_closes)
        | test(=service::migration::real_voters_release_a_private_migration_without_reopening_the_publisher)
        | test(=service::rollback::a_compacted_member_waits_for_the_owners_kept_rollback_seal)
    ))
    | (binary_id(rocky-sdk::integration) & (
          test(=shopping_release::a_device_joining_after_a_move_starts_the_list_from_a_checkpoint)
        | test(=shopping_release::two_phones_never_online_together_pass_the_release_gate_through_custody)
    ))
    | (binary_id(rocky-secure) & (
          test(=tests::checkpoint::process_exit_inside_any_checkpoint_step_leaves_a_file_that_opens_and_audits)
        | test(=tests::checkpoint::retained_bytes_trigger_checkpoints_and_pruning_then_backpressure)
        | test(=tests::group::wal_stays_bounded_under_sustained_authoring)
        | test(=tests::roles::a_far_behind_replica_catches_up_while_both_sides_keep_writing)
        | test(=tests::roles::a_sync_larger_than_a_session_continues_on_the_next)
        | test(=tests::roles::interrupted_transfers_resume_and_a_replacement_full_node_converges)
    ))
'''


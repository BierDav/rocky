# Test tiers and their budgets; see docs/development.md#test-budgets and
# docs/decisions/0060-test-tiers-and-budgets.md. `scripts/test-tiers` enforces them.
#
# A test belongs to the first tier whose filter matches it (nextest filterset
# syntax): e2e, then integration; every other test is a unit test. So each test
# has exactly one tier, and a new test starts as a unit test unless it is in an
# integration test target. Ignored tests run only in e2e, and only those its
# filter names; the others are helpers and explicit measurements.

[unit]
per-test = "10ms"
suite = "10s"

# Phase 8: secure history/retirement and SDK delivery/recovery exercise real
# SQLite or credential sealing. The package filters below include them; the
# pure rocky-core epoch-order property and SDK capacity check stay in unit.
# Phase 11: `tests::chains` (session chain table, stored chains, chains beside
# a checkpoint page) uses real SQLite and is included by the rocky-secure filter.
# The shopping release hub gate remains e2e; no budget exception is added.
# Phase 18 endpoint socket-rebind and borrowed-ownership tests use real
# loopback sockets; kind(test) includes them with the unchanged 2 s budget.
# Phase 21 Kotlin/Native application tests run in check-ios on macOS, enforce
# the same 2 s integration budget, and are outside nextest. The agent-device
# procedure is e2e (15 min). No Rust filter or budget exception is needed.
# Phase 20 adds Kotlin application integration and shopping multi-process e2e
# gates in the shopping CI job; scripts/test-tiers handles Rust binaries only.
# The Rust driver projection and secure checkpoint custody regressions use real
# SQLite and sessions; the existing integration filters include them.
# No filter change or exception is needed.
# Round48 checkpoint byte/signature fixtures use the crypto integration budget.
[integration]
per-test = "2s"
suite = "5m"
filter = '''
    kind(test)
    | (package(rocky-secure) & test(/^replica::checkpoint::backend_vectors::/))
    | (package(rocky-secure) & test(/^tests::/))
    | (package(rocky-secure) & test(/^replica::coordinated::abandoned::tests::/))
    | (package(rocky-secure) & test(/^network::(holdings|contacts)::tests::/))
    | (package(rocky-secure) & test(/^network::link::integration_tests::/))
    | (package(rocky-secure) & test(/^network::budgets::/))
    | (package(rocky-runtime) & !test(/^(read|checkpoint)::tests::/))
    | (package(rocky-runtime) & test(=read::tests::pages_through_null_ordering_values_cover_the_result_once))
    | (package(rocky-coordinator) & test(/^(client::tests|raft_store::tests|machine::(public_tests|coordinated_tests|tip_tests))::/))
    | (package(rocky-sdk) & test(/^(database|enrollment|mesh|node|simulation)::/))
    | (package(rocky-storage) & test(/^(cursor|database|sqlite)::tests::/))
    | (package(rocky-credentials) & (test(/^keys::tests::/) | test(=revocation::tests::every_interleaving_of_merges_yields_one_digest)))
    | (package(runtime-scaling) & (test(/^(soak|wide)::tests::/) | test(=attribution::tests::storage_facts_read_the_sqlite_header)))
    | (package(todo-desktop) & test(/^secure_demo::/))
'''

# End to end: soak tests, the fsync probe, and the tests that need more than the
# integration budget even alone: crash sweeps over every step, full-size
# limits, multi-process clusters, and waits on production deadlines (the
# coordinator client's 12 s request deadline, the 5 s write lease, the service
# drain). Each was over 1.5 s alone on the reference host; the measurements are
# in docs/features_07/01-test-tiers-evidence.md. Name a test here only with its
# measured time; a test that is only slow should be made faster instead.
# Phase 10 evidence records the owned QUIC shutdown tests at 2.7/2.6 s.
# Phase 15: the mDNS run waits 2 s to show that another topic stays silent
# (3.0 s); the two-process discovery runs enroll three devices and start a
# second process (4.1 s each). See docs/features_07/15-discovery-evidence.md.
# features_09 phase 8's three-voter election/deadline/restart gate: 3.62 s alone.
# features_09 phase 7's full-size migration: 100,000 rows seeded and filled by
# migrations and pulled by a member, 481 s alone; see
# docs/features_09/07-migrations-at-any-size.md#evidence.
# features_09 phase 17's coordinated recovery regression commits the real
# 1,025-entry hash window before signing: 45.3 s alone in the e2e profile.
# features_09 core prerequisites: real-voter migration and QUIC restarts took
# 4.606 s alone. Rollback crosses the real 256-operation retention window
# and real transport deadlines; round38 passes in 45.919 s after the
# original 71.398 s restoration failure. Budgets and retention remain unchanged.
[e2e]
suite = "15m"
# Owner-authorized 2026-10-21: run the full migration in both builds outside
# the combined suite clock. Its assertions and existing 600 s timeout remain.
# features_11 phase 2 records the simulation sweep's exemption: its shards run
# 1,000 seeds in 10.5 min on 16 shards, 18 cores (2026-10-25), in the workspace build only.
suite-exempt-filter = '''
    (binary_id(=rocky-sdk::migrations)
    & test(=a_migration_of_100000_rows_converges_on_every_member))
    | (package(rocky-sdk) & test(/^simulation::tests::sweep_/))
'''
filter = '''
    (package(rocky-secure) & test(/lthash_100000/))
    | (package(rocky-secure) & test(/positions_10000/))
    | (package(rocky-secure) & test(/finalization_100000/))
    | (package(rocky-secure) & test(=tests::coordinated::recovery::regressions::collects_every_entry_across_the_real_hash_window_before_recovery_is_signed))
    | (binary_id(rocky-coordinator::coordinated_log) & test(=coordinated_log_survives_leader_change_and_deadline_without_double_commit))
    | (package(rocky-sdk) & test(/^node::delivery_tests::(a_crash_|a_mailbox_refuses_at_both_bounds)/))
    | test(/::soak_/)
    | (package(rocky-sdk) & test(/^simulation::tests::sweep_/))
    | (package(rocky-coordinator) & test(=raft_store::probe::coordinator_state_settles_after_one_retention_window))
    | (binary_id(rocky-coordinator) & (
          test(=raft_store::tests::openraft_storage_contract)
    ))
    | (binary_id(rocky-coordinator::cluster) & (
          test(=three_persistent_voters_keep_controls_and_logs_across_restarts)
        | test(=crashes_at_log_commit_apply_reply_and_snapshot_boundaries)
        | test(=three_persistent_voters_fence_recover_and_verify_offline)
    ))
    | (binary_id(rocky-coordinator::public) & (
          test(=a_completely_restored_service_stays_fenced)
        | test(=outages_and_restarts_keep_state_and_restore_is_fenced)
    ))
    | (binary_id(rocky-runtime) & (
          test(=audit_tests::observer_and_retained_history_quotas_preserve_existing_work)
        | test(=instrumentation_tests::checkpoint_intervals_are_recorded_in_monotonic_order_when_instrumented)
        | test(=retention_tests::death_inside_any_step_leaves_a_file_that_opens_and_audits)
        | test(=stored_state_tests::open_does_not_replay_and_a_domain_outgrows_the_former_quota)

name: CI

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .config/nextest.toml
      - scripts/check
      - crates/**
      - examples/**
      - sdks/**
      - tests/**
      - benchmarks/runtime-scaling/**
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_HOME: /Users/gitea-runner/.cargo
  RUSTUP_HOME: /Users/gitea-runner/.rustup
  PATH: /Users/gitea-runner/.cargo/bin:/Users/gitea-runner/node/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
  RUSTUP_TOOLCHAIN: 1.99.0
  NEXTEST_PROFILE: default

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Rust tools to PATH
        run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: check
      - name: Run checks
        run: ./scripts/check

  slow:
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Rust tools to PATH
        run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: check
      - name: Run slow checks
        run: ./scripts/check --slow

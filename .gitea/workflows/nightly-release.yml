name: Nightly release

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gitea-nightly-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      release: ${{ steps.changes.outputs.release }}
      version: ${{ steps.release.outputs.version }}
      notes: ${{ steps.release.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for unreleased code
        id: changes
        env:
          GITEA_API_URL: ${{ github.api_url }}
          GITEA_TOKEN: ${{ github.token }}
          GITEA_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          releases=$(curl --fail --silent --show-error \
            --header "Authorization: token $GITEA_TOKEN" \
            "$GITEA_API_URL/repos/$GITEA_REPOSITORY/releases?limit=50")
          latest=$(printf '%s' "$releases" | jq -r '[.[] | select(.prerelease == true and .draft == false)] | sort_by(.created_at) | last | .tag_name // empty')
          if [ -z "$latest" ]; then
            echo 'release=true' >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags origin "refs/tags/$latest:refs/tags/$latest"
            if [ "$(git rev-list --count "$latest..HEAD" -- .)" -eq 0 ]; then
              echo 'release=false' >> "$GITHUB_OUTPUT"
            elif git diff --name-only "$latest...HEAD" | grep -vE '(^|/)[^/]+\.md$' | grep -Eq '^(crates/|sdks/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|project\.yaml$|project\.module-template\.yaml$|kotlin$|\.dockerignore$)'; then
              echo 'release=true' >> "$GITHUB_OUTPUT"
            else
              echo 'release=false' >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Prepare version and notes
        if: steps.changes.outputs.release == 'true'
        id: release
        env:
          GITEA_API_URL: ${{ github.api_url }}
          GITEA_TOKEN: ${{ github.token }}
          GITEA_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tags=$(curl --fail --silent --show-error \
            --header "Authorization: token $GITEA_TOKEN" \
            "$GITEA_API_URL/repos/$GITEA_REPOSITORY/tags?limit=50" | jq -r '.[].name')
          while IFS= read -r tag; do
            [ -z "$tag" ] || git tag "$tag" "$(git rev-parse "$tag^{commit}" 2>/dev/null || printf '%s' "$tag")" 2>/dev/null || true
          done <<EOF_TAGS
          $tags
          EOF_TAGS
          mkdir -p "$RUNNER_TEMP/git-cliff"
          curl --fail --silent --show-error --location \
            https://github.com/orhun/git-cliff/releases/download/v2.14.2/git-cliff-2.14.2-aarch64-apple-darwin.tar.gz \
            --output "$RUNNER_TEMP/git-cliff.tar.gz"
          checksum=$(shasum -a 256 "$RUNNER_TEMP/git-cliff.tar.gz" | awk '{print $1}')
          [ "$checksum" = 'a0be97e237d440d34c5e508ec21d070b2c85cbb8be48a46a56f9a4e8bd247f05' ]
          tar -xzf "$RUNNER_TEMP/git-cliff.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/git-cliff"
          export PATH="$RUNNER_TEMP/git-cliff:$PATH"
          version=$(printf '%s\n' "$tags" | ./scripts/release/version nightly)
          notes=$("$RUNNER_TEMP/git-cliff/git-cliff" --tag "$version" --latest --strip header)
          delimiter=$(uuidgen)
          {
            echo "version=$version"
            echo "notes<<$delimiter"
            printf '%s\n' "$notes"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  check:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-nextest
        run: |
          if ! cargo nextest --version >/dev/null 2>&1; then
            cargo install cargo-nextest --locked
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: check
      - name: Run checks
        run: ./scripts/check

  slow:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-nextest
        run: |
          if ! cargo nextest --version >/dev/null 2>&1; then
            cargo install cargo-nextest --locked
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: check
      - name: Run slow checks
        run: ./scripts/check --slow

  publish:
    needs: [prepare, check, slow]
    if: needs.prepare.outputs.release == 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      GITEA_API_URL: ${{ github.api_url }}
      GITEA_TOKEN: ${{ github.token }}
      GITEA_REPOSITORY: ${{ github.repository }}
      GITHUB_SHA: ${{ github.sha }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_NOTES: ${{ needs.prepare.outputs.notes }}
    steps:
      - name: Publish Gitea prerelease
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --arg tag "$RELEASE_VERSION" \
            --arg title "Rocky DB $RELEASE_VERSION" \
            --arg target "$GITHUB_SHA" \
            --arg body "$RELEASE_NOTES" \
            '{tag_name:$tag, name:$title, target_commitish:$target, body:$body, draft:false, prerelease:true}')
          curl --fail --silent --show-error --location \
            --request POST \
            --header "Authorization: token $GITEA_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$GITEA_API_URL/repos/$GITEA_REPOSITORY/releases"

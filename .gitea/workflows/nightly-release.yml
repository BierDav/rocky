name: Gitea nightly release

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gitea-nightly-release
  cancel-in-progress: false

env:
  GH_HOST: gitea.quickme.at
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  release:
    name: Check and publish nightly
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - name: Require the default branch
        if: github.ref_name != github.event.repository.default_branch
        run: |
          echo "::error::Nightly releases are cut from the default branch."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: check

      - name: Check whether shipped code changed
        id: changes
        run: |
          set -euo pipefail
          latest="$(gh release list --repo "${GH_REPO}" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // ""')"
          if [ -z "${latest}" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            release="$(scripts/release/code-changed "${latest}" "${GITHUB_SHA}")"
            echo "release=${release}" >> "$GITHUB_OUTPUT"
            if [ "${release}" != true ]; then
              echo "No shipped code changed since ${latest}; no nightly release."
            fi
          fi

      - name: Install git-cliff
        if: steps.changes.outputs.release == 'true'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/git-cliff.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "${archive}" \
            https://github.com/orhun/git-cliff/releases/download/v2.14.2/git-cliff-2.14.2-aarch64-apple-darwin.tar.gz
          echo "a0be97e237d440d34c5e508ec21d070b2c85cbb8be48a46a56f9a4e8bd247f05  ${archive}" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/git-cliff"
          tar -xzf "${archive}" --strip-components=1 -C "$RUNNER_TEMP/git-cliff"
          echo "$RUNNER_TEMP/git-cliff" >> "$GITHUB_PATH"

      - name: Compute the version and release notes
        id: version
        if: steps.changes.outputs.release == 'true'
        run: |
          set -euo pipefail
          version="$(gh api --paginate "repos/${GH_REPO}/git/matching-refs/tags/v" \
            --jq '.[].ref | ltrimstr("refs/tags/")' | scripts/release/version nightly)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          git-cliff --unreleased --tag "v${version}" --strip all > "$RUNNER_TEMP/release-notes.md"
          {
            echo "## v${version}"
            echo
            cat "$RUNNER_TEMP/release-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run the release checks
        if: steps.changes.outputs.release == 'true'
        run: ./scripts/check

      - name: Run the slow release checks
        if: steps.changes.outputs.release == 'true'
        run: ./scripts/check --slow

      - name: Publish the Gitea prerelease
        if: steps.changes.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            --repo "${GH_REPO}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --prerelease \
            --latest=false \
            --notes-file "$RUNNER_TEMP/release-notes.md"

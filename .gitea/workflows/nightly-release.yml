name: Gitea nightly release

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gitea-nightly-release
  cancel-in-progress: false

env:
  GITEA_API_URL: ${{ github.api_url }}
  GITEA_TOKEN: ${{ github.token }}
  GITEA_REPOSITORY: ${{ github.repository }}
  CARGO_HOME: /Users/gitea-runner/.cargo
  RUSTUP_HOME: /Users/gitea-runner/.rustup
  PATH: /Users/gitea-runner/.cargo/bin:/Users/gitea-runner/node/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
  RUSTUP_TOOLCHAIN: 1.99.0
  NEXTEST_PROFILE: default

jobs:
  release:
    name: Check and publish nightly
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - name: Require the default branch
        if: github.ref_name != github.event.repository.default_branch
        run: |
          echo "::error::Nightly releases are cut from the default branch."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Rust tools to PATH
        run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: check

      - name: Check whether shipped code changed
        id: changes
        run: |
          set -euo pipefail
          latest="$(curl --fail --silent --show-error \
            --header "Authorization: token ${GITEA_TOKEN}" \
            "${GITEA_API_URL}/repos/${GITEA_REPOSITORY}/releases?limit=50" \
            | jq -r '[.[] | select(.draft == false)] | .[0].tag_name // ""')"
          if [ -z "${latest}" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            release="$(scripts/release/code-changed "${latest}" "${GITHUB_SHA}")"
            echo "release=${release}" >> "$GITHUB_OUTPUT"
            if [ "${release}" != true ]; then
              echo "No shipped code changed since ${latest}; no nightly release."
            fi
          fi

      - name: Install git-cliff
        if: steps.changes.outputs.release == 'true'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/git-cliff.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "${archive}" \
            https://github.com/orhun/git-cliff/releases/download/v2.14.2/git-cliff-2.14.2-aarch64-apple-darwin.tar.gz
          echo "a0be97e237d440d34c5e508ec21d070b2c85cbb8be48a46a56f9a4e8bd247f05  ${archive}" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/git-cliff"
          tar -xzf "${archive}" --strip-components=1 -C "$RUNNER_TEMP/git-cliff"
          echo "$RUNNER_TEMP/git-cliff" >> "$GITHUB_PATH"

      - name: Compute the version and release notes
        id: version
        if: steps.changes.outputs.release == 'true'
        run: |
          set -euo pipefail
          tags="$(curl --fail --silent --show-error \
            --header "Authorization: token ${GITEA_TOKEN}" \
            "${GITEA_API_URL}/repos/${GITEA_REPOSITORY}/tags?limit=50" \
            | jq -r '.[].name')"
          version="$(printf '%s\n' "${tags}" | scripts/release/version nightly)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          git-cliff --unreleased --tag "v${version}" --strip all > "$RUNNER_TEMP/release-notes.md"
          {
            echo "## v${version}"
            echo
            cat "$RUNNER_TEMP/release-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run the release checks
        if: steps.changes.outputs.release == 'true'
        run: ./scripts/check

      - name: Run the slow release checks
        if: steps.changes.outputs.release == 'true'
        run: ./scripts/check --slow

      - name: Publish the Gitea prerelease
        if: steps.changes.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg tag "v${VERSION}" \
            --arg target "${GITHUB_SHA}" \
            --arg title "v${VERSION}" \
            --rawfile body "$RUNNER_TEMP/release-notes.md" \
            '{tag_name: $tag, target_commitish: $target, name: $title, body: $body, draft: false, prerelease: true}')"
          curl --fail --silent --show-error --location \
            --request POST \
            --header "Authorization: token ${GITEA_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "${payload}" \
            "${GITEA_API_URL}/repos/${GITEA_REPOSITORY}/releases"

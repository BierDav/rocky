name: Record a passing tree
description: >-
  Records the marker that the reuse-build action looks up, so a later run of
  the same tree skips the job. Run it last, only when the job ran its steps.

inputs:
  job:
    description: The job's marker name, as given to reuse-build.
    required: true
  tree:
    description: The source tree of the event revision.
    required: true

runs:
  using: composite
  steps:
    - name: Record the passing tree
      shell: sh
      run: touch passed

    - uses: actions/cache/save@v4
      with:
        path: passed
        key: baseline-${{ inputs.job }}-${{ runner.os }}-${{ inputs.tree }}

name: Install Java 21
description: Install Temurin, using a bounded release lookup on Gitea.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      if: github.server_url == 'https://github.com'
      with:
        distribution: temurin
        java-version: "21"

    - name: Download the current Temurin 21 package
      if: github.server_url != 'https://github.com'
      id: archive
      shell: bash
      run: bash "${{ github.action_path }}/../../../scripts/ci/download-java"

    - uses: actions/setup-java@v5
      if: github.server_url != 'https://github.com'
      with:
        distribution: jdkfile
        java-version: ${{ steps.archive.outputs.version }}
        jdkFile: ${{ steps.archive.outputs.jdk-file }}

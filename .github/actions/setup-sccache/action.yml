name: Set up sccache
description: >-
  Install the pinned sccache that `.cargo/config.toml` names as rustc-wrapper.
  Its cache lives in the Actions cache.

runs:
  using: composite
  steps:
    - name: Install sccache
      shell: bash
      run: bash "${{ github.action_path }}/../../../scripts/ci/install-sccache"

    # Only JavaScript actions see the cache service credentials; export them
    # for sccache's GitHub Actions backend, as mozilla-actions/sccache-action does.
    - name: Use the Actions cache for sccache
      uses: actions/github-script@v7
      with:
        script: |
          for (const name of ['ACTIONS_CACHE_SERVICE_V2', 'ACTIONS_RESULTS_URL', 'ACTIONS_CACHE_URL', 'ACTIONS_RUNTIME_TOKEN']) {
            if (process.env[name]) core.exportVariable(name, process.env[name]);
          }
          core.exportVariable('SCCACHE_GHA_ENABLED', 'true');

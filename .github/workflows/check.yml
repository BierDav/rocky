name: Baseline checks

# A job that passed for the same source tree records a cache marker; later runs
# of that tree (rebased, redescribed or released commits) reuse it instead of
# running again. See docs/development.md#ci.

on:
  # Only the default branch and the release call run baselines; there are no
  # other long-lived branches or pull requests.
  push:
    branches: [main]
  # Releases call only `build` and `check`; auxiliary jobs run on pushes.
  # The build and checks are skipped for a tree that passed.
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

# A newer push supersedes a run, but a release's call must not cancel another
# release's checks, which share the caller's workflow name and ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CARGO_TERM_COLOR: always
  # Smaller test binaries and build cache; backtraces keep line numbers.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # The SDK persists `identity.json` from its runtime thread; a fault-injection
  # test can race the temporary path a persist briefly holds. Retry once.
  NEXTEST_RETRIES: 1

jobs:
  lint:
    if: ${{ !inputs.release }}
    # Formatting and static lint checks need no build, so they fail fast; see docs/linting.md.
    # Any architecture.
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'ubuntu-latest-any-arch' }}
    timeout-minutes: 15
    steps:
      - name: Download the exact source revision
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          # GitHub and Gitea serve the same archive and commit endpoints.
          api() {
            curl --fail --silent --show-error --location \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              "${GH_API_URL}/repos/${GH_REPOSITORY}/$1"
          }
          api "tarball/${GH_REVISION}" > "$RUNNER_TEMP/source.tar.gz"
          mkdir source
          tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C source
          echo "tree=$(api "commits/${GH_REVISION}?stat=false&files=false" | jq -r .commit.tree.sha)" >> "$GITHUB_OUTPUT"

      - name: Look for a passing run of this tree
        id: passed
        uses: actions/cache/restore@v4
        with:
          path: passed
          key: baseline-lint-${{ runner.os }}-${{ steps.source.outputs.tree }}
          lookup-only: true

      # ktlint runs on the JVM.
      - uses: ./source/.github/actions/setup-java
        if: steps.passed.outputs.cache-hit != 'true'

      - uses: dtolnay/rust-toolchain@1.99.0
        if: steps.passed.outputs.cache-hit != 'true'
        with:
          components: rustfmt, clippy

      - name: Install the pinned lint tools
        if: steps.passed.outputs.cache-hit != 'true'
        working-directory: source
        run: ./scripts/tools

      - name: Run formatting and lint checks
        if: steps.passed.outputs.cache-hit != 'true'
        working-directory: source
        run: ./scripts/lint

      - name: Record the passing tree
        if: steps.passed.outputs.cache-hit != 'true'
        run: touch passed

      - uses: actions/cache/save@v4
        if: steps.passed.outputs.cache-hit != 'true'
        with:
          path: passed
          key: baseline-lint-${{ runner.os }}-${{ steps.source.outputs.tree }}

  build:
    # Compiles once: clippy and the test binaries as nextest archives, plus the
    # custody peer. `check`, `e2e` and `shopping` run those artifacts instead of
    # building again, each downloading only what it runs; GitHub `shopping`
    # reuses the x64 peer, while Gitea builds its own.
    # Those jobs consume architecture-specific binaries, so they all pin one
    # architecture; Gitea's `-any-arch` label mixes x64 and arm64 runners.
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 60
    steps:
      - name: Download the exact source revision
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          # GitHub and Gitea serve the same archive and commit endpoints.
          api() {
            curl --fail --silent --show-error --location \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              "${GH_API_URL}/repos/${GH_REPOSITORY}/$1"
          }
          api "tarball/${GH_REVISION}" > "$RUNNER_TEMP/source.tar.gz"
          mkdir source
          tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C source
          echo "tree=$(api "commits/${GH_REVISION}?stat=false&files=false" | jq -r .commit.tree.sha)" >> "$GITHUB_OUTPUT"

      # A tree whose checks passed needs no build.
      - name: Look for a passing check of this tree
        id: passed
        uses: actions/cache/restore@v4
        with:
          path: passed
          key: baseline-check-${{ runner.os }}-${{ steps.source.outputs.tree }}
          lookup-only: true

      - name: Install the system build dependencies
        if: steps.passed.outputs.cache-hit != 'true'
        working-directory: source
        run: ./scripts/ci/install-system-deps

      - uses: dtolnay/rust-toolchain@1.99.0
        if: steps.passed.outputs.cache-hit != 'true'
        with:
          components: rustfmt, clippy

      # Cargo downloads use the dependency key; compiled workspace artifacts
      # use a new key per tree so rebuilt crates are saved for the next run.
      - uses: Swatinem/rust-cache@v2
        if: steps.passed.outputs.cache-hit != 'true'
        with:
          workspaces: source -> target
          shared-key: check
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Restore and save compiled workspace crates
        if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: source/target
          key: rust-target-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('source/Cargo.toml', 'source/Cargo.lock', 'source/rust-toolchain.toml') }}-${{ steps.source.outputs.tree }}
          restore-keys: |
            rust-target-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('source/Cargo.toml', 'source/Cargo.lock', 'source/rust-toolchain.toml') }}-

      - uses: taiki-e/install-action@v2
        if: steps.passed.outputs.cache-hit != 'true' && github.server_url == 'https://github.com'
        with:
          tool: cargo-nextest

      # install-action's checksum check fails with the Gitea runner's sha256sum,
      # so Gitea installs the matching nextest for the runner architecture.
      - name: Install cargo-nextest on Gitea
        if: steps.passed.outputs.cache-hit != 'true' && github.server_url != 'https://github.com'
        working-directory: source
        run: ./scripts/ci/install-nextest "$RUNNER_TEMP/nextest"

      - name: Build and archive the tests
        if: steps.passed.outputs.cache-hit != 'true'
        working-directory: source
        timeout-minutes: 300
        run: |
          set -euo pipefail
          ./scripts/check --build "$RUNNER_TEMP/build"

      # One artifact per consumer so a failure to finalize the large shared
      # archive cannot also lose the small ones, and `shopping`
      # download only what they run. Gitea's artifact service intermittently
      # fails on the large upload; a consumer rebuilds when its artifact is gone.
      - name: Upload the workspace test archive
        if: steps.passed.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nextest-workspace
          path: ${{ runner.temp }}/build/workspace.tar.zst
          retention-days: 1
          # The archives are already compressed.
          compression-level: 0

      - name: Upload the SDK test archive
        if: steps.passed.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nextest-sdk
          path: ${{ runner.temp }}/build/sdk-without-defaults.tar.zst
          retention-days: 1
          compression-level: 0

      - name: Upload the custody peer
        if: steps.passed.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: rocky-peer
          path: ${{ runner.temp }}/build/rocky-peer
          retention-days: 1
          compression-level: 0

  check:
    # A job after `build`: the source step, reuse-build, its own steps and
    # record-pass. Add a job the same way; see docs/development.md#adding-a-ci-job.
    needs: build
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 45
    steps:
      - name: Download the exact source revision
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          # GitHub and Gitea serve the same archive and commit endpoints.
          api() {
            curl --fail --silent --show-error --location \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              "${GH_API_URL}/repos/${GH_REPOSITORY}/$1"
          }
          api "tarball/${GH_REVISION}" > "$RUNNER_TEMP/source.tar.gz"
          mkdir source
          tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C source
          echo "tree=$(api "commits/${GH_REVISION}?stat=false&files=false" | jq -r .commit.tree.sha)" >> "$GITHUB_OUTPUT"

      - id: reuse
        uses: ./source/.github/actions/reuse-build
        with:
          job: check
          tree: ${{ steps.source.outputs.tree }}
          workspace-archive: true
          sdk-archive: true
          dependencies: fallback

      - name: Run formatting and the unit and integration tiers
        if: steps.reuse.outputs.passed != 'true'
        working-directory: source
        run: |
          if [ -f "$RUNNER_TEMP/build/workspace.tar.zst" ] \
              && [ -f "$RUNNER_TEMP/build/sdk-without-defaults.tar.zst" ]; then
            ./scripts/check --from "$RUNNER_TEMP/build"
          else
            # The build job already ran clippy; only its archives are missing.
            # Rebuild the test binaries without repeating clippy.
            ./scripts/check --no-clippy
          fi

      - uses: ./source/.github/actions/record-pass
        if: steps.reuse.outputs.passed != 'true'
        with:
          job: check
          tree: ${{ steps.source.outputs.tree }}

  e2e:
    # The end-to-end tier, soak tests included; it runs only in CI. On pushes to
    # the default branch; releases do not wait for it.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 45
    steps:
      - name: Download the exact source revision
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          # GitHub and Gitea serve the same archive and commit endpoints.
          api() {
            curl --fail --silent --show-error --location \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              "${GH_API_URL}/repos/${GH_REPOSITORY}/$1"
          }
          api "tarball/${GH_REVISION}" > "$RUNNER_TEMP/source.tar.gz"
          mkdir source
          tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C source
          echo "tree=$(api "commits/${GH_REVISION}?stat=false&files=false" | jq -r .commit.tree.sha)" >> "$GITHUB_OUTPUT"

      - id: reuse
        uses: ./source/.github/actions/reuse-build
        with:
          job: e2e
          tree: ${{ steps.source.outputs.tree }}
          workspace-archive: true
          sdk-archive: true
          dependencies: fallback

      - name: Run the end-to-end tier
        if: steps.reuse.outputs.passed != 'true'
        working-directory: source
        run: |
          if [ -f "$RUNNER_TEMP/build/workspace.tar.zst" ] \
              && [ -f "$RUNNER_TEMP/build/sdk-without-defaults.tar.zst" ]; then
            ./scripts/check --e2e --from "$RUNNER_TEMP/build"
          else
            ./scripts/check --e2e
          fi

      - uses: ./source/.github/actions/record-pass
        if: steps.reuse.outputs.passed != 'true'
        with:
          job: e2e
          tree: ${{ steps.source.outputs.tree }}

  shopping:
    # Shopping, Kotlin integration and exhaustive change-driven sync qualification.
    # Releases skip it; it does not gate a release.
    needs: build
    if: ${{ !inputs.release }}
    # The Android NDK requires x64; Gitea's build artifacts are arm64.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download the exact source revision
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          # GitHub and Gitea serve the same archive and commit endpoints.
          api() {
            curl --fail --silent --show-error --location \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              "${GH_API_URL}/repos/${GH_REPOSITORY}/$1"
          }
          api "tarball/${GH_REVISION}" > "$RUNNER_TEMP/source.tar.gz"
          mkdir source
          tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C source
          echo "tree=$(api "commits/${GH_REVISION}?stat=false&files=false" | jq -r .commit.tree.sha)" >> "$GITHUB_OUTPUT"

      # The Kotlin build compiles the native library, which needs the
      # restored registry even with the custody peer. The x64 baseline peer
      # matches only the GitHub runner; Gitea's qualification builds it itself.
      - id: reuse
        uses: ./source/.github/actions/reuse-build
        with:
          job: shopping
          tree: ${{ steps.source.outputs.tree }}
          peer: true
          peer-github-only: true
          nextest: false

      - uses: ./source/.github/actions/setup-java
        if: steps.reuse.outputs.passed != 'true'

      - uses: android-actions/setup-android@v3
        if: steps.reuse.outputs.passed != 'true' && github.server_url != 'https://github.com'
        with:
          packages: ""

      - name: Install the Android runtime prerequisites
        if: steps.reuse.outputs.passed != 'true'
        run: |
          set -euo pipefail
          sdkmanager="$(command -v sdkmanager || echo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$sdkmanager" --licenses > /dev/null || true
          for attempt in 1 2 3; do
            "$sdkmanager" --install "platforms;android-35" "ndk;28.2.13676358" && break
            [ "$attempt" -lt 3 ] || exit 1
          done
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Run the shopping qualification
        if: steps.reuse.outputs.passed != 'true'
        working-directory: source
        run: |
          set -euo pipefail
          # Artifacts do not keep the executable bit.
          if [ -f "$RUNNER_TEMP/build/rocky-peer" ]; then
            chmod +x "$RUNNER_TEMP/build/rocky-peer"
            export ROCKY_PEER="$RUNNER_TEMP/build/rocky-peer"
          fi
          # The application resolves Rocky from Maven local.
          sdks/kotlin/gradlew -p sdks/kotlin publishKotlinMultiplatformPublicationToMavenLocal \
            publishJvmPublicationToMavenLocal publishAndroidPublicationToMavenLocal \
            :rocky-runtime-android:publishReleasePublicationToMavenLocal
          ./scripts/ci/local-maven
          ./examples/shoppinglist-app/qualify
          sdks/kotlin/gradlew -p sdks/kotlin check
          ./examples/shoppinglist-app/check
          cargo test --locked --release -p rocky-sdk --lib cancellation_at_every_session_byte -- --ignored --nocapture

      - uses: ./source/.github/actions/record-pass
        if: steps.reuse.outputs.passed != 'true'
        with:
          job: shopping
          tree: ${{ steps.source.outputs.tree }}

  android:
    if: ${{ !inputs.release }}
    # Runs the release workflow's Android build steps to keep its caches warm:
    # Gradle's files, and the Cargo registry with the
    # native target directory. The release restores both and saves them again,
    # so a nightly build does not recompile the Android runtime from nothing.
    # The cache keys must stay identical to the release workflow's Android job.
    # After `build`, so a commit that does not compile spends no Android build;
    # it cannot reuse the shared Linux build.
    needs: build
    # x64: the Android NDK has no Linux arm64 host build.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download the exact source revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REVISION: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --output "$RUNNER_TEMP/source.tar.gz" \
            "${GH_API_URL}/repos/${GH_REPOSITORY}/tarball/${GH_REVISION}"
          mkdir source
          tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C source

      - name: Restore the Android toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle
          key: android-tooling-${{ runner.os }}-${{ hashFiles('source/sdks/kotlin/**/*.gradle.kts', 'source/sdks/kotlin/**/*.properties', 'source/sdks/kotlin/gradle/libs.versions.toml') }}
          restore-keys: |
            android-tooling-${{ runner.os }}-

      - name: Restore the Android native cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            source/sdks/native/target
          key: android-native-${{ runner.os }}-${{ hashFiles('source/sdks/native/Cargo.lock', 'source/rust-toolchain.toml', 'source/sdks/kotlin/build-logic/src/main/kotlin/Android.kt') }}
          restore-keys: |
            android-native-${{ runner.os }}-

      - uses: ./source/.github/actions/setup-java

      # Gitea's runner image has no Android SDK.
      - uses: android-actions/setup-android@v3
        if: github.server_url != 'https://github.com'
        with:
          packages: ""

      # The versions docs/runtime/android.md names.
      # The NDK download is large and occasionally truncated; GitHub's image has
      # an SDK already.
      - name: Cache the Android platform and NDK
        if: github.server_url != 'https://github.com'
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-35
            ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          key: android-sdk-${{ runner.os }}-35-ndk-28.2.13676358

      - name: Install the Android platform and NDK
        run: |
          set -euo pipefail
          sdkmanager="$(command -v sdkmanager || echo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager")"
          yes | "${sdkmanager}" --licenses > /dev/null || true
          for attempt in 1 2 3; do
            "${sdkmanager}" --install "platforms;android-35" "ndk;28.2.13676358" && break
            [ "${attempt}" -lt 3 ] || exit 1
          done
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install the system build dependencies
        working-directory: source
        run: ./scripts/ci/install-system-deps

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - name: Build the Android runtime and libraries
        working-directory: source
        run: |
          sdks/kotlin/gradlew -p sdks/kotlin publishAndroidPublicationToMavenLocal \
            :rocky-runtime-android:publishReleasePublicationToMavenLocal

      - name: Save the Android toolchain cache
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle
          key: android-tooling-${{ runner.os }}-${{ hashFiles('source/sdks/kotlin/**/*.gradle.kts', 'source/sdks/kotlin/**/*.properties', 'source/sdks/kotlin/gradle/libs.versions.toml') }}

      - name: Save the Android native cache
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            source/sdks/native/target
          key: android-native-${{ runner.os }}-${{ hashFiles('source/sdks/native/Cargo.lock', 'source/rust-toolchain.toml', 'source/sdks/kotlin/build-logic/src/main/kotlin/Android.kt') }}

  ios:
    if: ${{ !inputs.release }}
    needs: build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Download the exact source revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REVISION: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --output "$RUNNER_TEMP/source.tar.gz" \
            "${GH_API_URL}/repos/${GH_REPOSITORY}/tarball/${GH_REVISION}"
          mkdir source
          tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C source

      - name: Install the repository toolchain and iOS targets
        working-directory: source
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy
          rustup target add --toolchain "$toolchain" aarch64-apple-ios aarch64-apple-ios-sim
          xcrun --sdk iphonesimulator --show-sdk-path

      - uses: ./source/.github/actions/setup-java

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/sdks/native -> target
          shared-key: ios

      - name: Qualify the iOS matrix and binding
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p local/phase17-evidence
          ./sdks/native/check-ios 2>&1 | tee local/phase17-evidence/matrix.log
          ./sdks/native/qualify-ios-binding 2>&1 | tee local/phase17-evidence/callbacks.log
          sdks/kotlin/gradlew -p sdks/kotlin compileKotlinIosArm64
          # The simulator runtime carries the fault injection the lifecycle probes use.
          sdks/kotlin/gradlew -p sdks/kotlin -Procky.qualification=true iosSimulatorArm64Test 2>&1 | tee local/phase17-evidence/sdk.log
          sdks/kotlin/gradlew -p sdks/kotlin jvmTest :qualification:packaged-jvm:check

      - name: Qualify iOS lifecycle and artifact-only consumer
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p local/phase18-evidence
          ./sdks/native/qualify-ios-lifecycle 2>&1 | tee local/phase18-evidence/lifecycle.log
          sdks/kotlin/gradlew -p sdks/kotlin packageIos 2>&1 | tee local/phase18-evidence/package.log
          sdks/kotlin/gradlew -p sdks/kotlin qualifyIosPackage 2>&1 | tee local/phase18-evidence/consumer.log

      - name: Qualify iOS simulator discovery
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p local/phase15-evidence
          ./sdks/native/qualify-ios-discovery 2>&1 | tee local/phase15-evidence/discovery.log

      - name: Save Phase 15 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase15-ios-evidence
          path: source/local/phase15-evidence

      - name: Build and qualify the iOS applications
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p local/phase21-evidence
          npm install --global agent-device@0.21.23
          # The application resolves Rocky from Maven local.
          sdks/kotlin/gradlew -p sdks/kotlin publishKotlinMultiplatformPublicationToMavenLocal \
            publishIosArm64PublicationToMavenLocal publishIosSimulatorArm64PublicationToMavenLocal
          ./examples/shoppinglist-app/check-ios 2>&1 | tee local/phase21-evidence/build-and-tests.log
          ./scripts/coordinator-local local/phase21-service 17300
          trap 'kill $(cat local/phase21-service/voter-*.pid)' EXIT
          simulator=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["isAvailable"] and "iPhone" in d["name"]))
          ')
          agent-device boot --platform ios --udid "$simulator"
          ./examples/shoppinglist-app/qualify-ios --device "$simulator" --bundle local/phase21-service/service/bundle.json

      - name: Save Phase 21 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase21-ios-evidence
          path: source/local/phase21-evidence

      - name: Save Phase 18 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-ios-evidence
          path: source/local/phase18-evidence

      - name: Save simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase17-ios-evidence
          path: source/local/phase17-evidence

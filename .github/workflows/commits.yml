name: Commit messages

# Every pushed or proposed commit follows Conventional Commits, which the
# release versions are computed from; see docs/commits.md.

on:
  push:
  pull_request:
    # `edited` re-checks a changed title.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    # Any architecture; Gitea has more arm64 runners.
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 5
    steps:
      # A pull request is checked by its base's rules, so it cannot relax them.
      - name: Download the linter's source revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REVISION: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --output "$RUNNER_TEMP/source.tar.gz" \
            "${GH_API_URL}/repos/${GH_REPOSITORY}/tarball/${GH_REVISION}"
          mkdir source
          tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C source

      - name: Check the commit messages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
          # Autosquash commits must not reach main, directly or by a merge.
          PROTECTED: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}
        run: |
          set -euo pipefail
          set --
          [ "${PROTECTED}" = true ] && set -- --protected
          if [ -n "${PULL_REQUEST}" ]; then
            # A squash merge uses the title as the commit header.
            printf '%s\n' "${PULL_REQUEST_TITLE}" | source/scripts/commitlint "$@" - 2>&1 \
              | sed "s/^commitlint: stdin/commitlint: pull request title/" || title_failed=1
            # The same endpoint and paging on GitHub and Gitea.
            : > "$RUNNER_TEMP/commits"
            page=1
            while :; do
              curl --fail --silent --show-error --location \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "Accept: application/vnd.github+json" \
                "${GH_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST}/commits?per_page=50&page=${page}" \
                > "$RUNNER_TEMP/page"
              [ "$(jq length "$RUNNER_TEMP/page")" -gt 0 ] || break
              jq -r '.[] | [.sha, (.commit.message | @base64)] | @tsv' "$RUNNER_TEMP/page" >> "$RUNNER_TEMP/commits"
              page=$((page + 1))
            done
          else
            jq -r '.commits[] | [.id, (.message | @base64)] | @tsv' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/commits"
          fi
          failed=${title_failed:-0}
          while IFS="$(printf '\t')" read -r sha message; do
            printf '%s' "$message" | base64 --decode | source/scripts/commitlint "$@" - 2>&1 \
              | sed "s/^commitlint: stdin/commitlint: ${sha}/" || failed=1
          done < "$RUNNER_TEMP/commits"
          exit "$failed"

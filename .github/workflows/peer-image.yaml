name: Custody peer image

# Builds the `rocky-peer` container image for the always-on custody service
# and publishes a multi-architecture manifest to public GHCR. The deployment
# pins the manifest digest in selfhosted-platform; see
# docs/runtime/always-on-peer.md.

on:
  push:
    branches:
      - main
    paths:
      - "crates/rocky-sdk/**"
      - "crates/rocky-secure/**"
      - "crates/rocky-storage/**"
      - "crates/rocky-runtime/**"
      - "crates/rocky-coordinator/**"
      - "crates/rocky-core/**"
      - "crates/rocky-credentials/**"
      - "crates/rocky-iroh/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/rocky-sdk/Dockerfile"
      - ".dockerignore"
      - ".github/workflows/peer-image.yaml"
  # Pull requests only build, to catch a broken Dockerfile before it reaches
  # main; nothing is pushed.
  pull_request:
    paths:
      - "crates/rocky-sdk/**"
      - "crates/rocky-secure/**"
      - "crates/rocky-storage/**"
      - "crates/rocky-runtime/**"
      - "crates/rocky-coordinator/**"
      - "crates/rocky-core/**"
      - "crates/rocky-credentials/**"
      - "crates/rocky-iroh/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/rocky-sdk/Dockerfile"
      - ".dockerignore"
      - ".github/workflows/peer-image.yaml"
  workflow_dispatch:
  # The release workflow adds the version and its channel tag; see docs/releasing.md.
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      channel:
        type: string
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: peer-image-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Registries require a lowercase repository name; `github.repository_owner` is
  # `BierDav` on GitHub, which Docker rejects in a tag.
  NAME: bierdav/rocky-db-peer

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ github.server_url == 'https://github.com' && matrix.runner || matrix.gitea-runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners, not QEMU: a release build of a Rust workspace under
          # emulation is many times slower than the hosted arm64 runner. Gitea's
          # runners use their own labels.
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            gitea-runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            gitea-runner: ubuntu-24.04-arm64
    steps:
      - name: Download the exact source revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REVISION: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --output "$RUNNER_TEMP/source.tar.gz" \
            "${GH_API_URL}/repos/${GH_REPOSITORY}/tarball/${GH_REVISION}"
          mkdir source
          tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C source

      # GHCR on GitHub; the instance's own container registry on Gitea.
      - name: Select the registry
        run: |
          if [ "${GITHUB_SERVER_URL}" = https://github.com ]; then
            registry=ghcr.io
          else
            registry="${GITHUB_SERVER_URL#*://}"
          fi
          echo "REGISTRY=${registry}" >> "$GITHUB_ENV"
          echo "IMAGE=${registry}/${NAME}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.server_url == 'https://github.com' && github.actor || github.repository_owner }}
          password: ${{ github.server_url == 'https://github.com' && secrets.GITHUB_TOKEN || secrets.PACKAGE_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: source
          file: source/crates/rocky-sdk/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
          # Gitea's cache server may not serve BuildKit; a cold build still works.
          cache-from: type=gha,scope=peer-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=peer-${{ matrix.arch }},ignore-error=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=rocky-peer
            org.opencontainers.image.description=Rocky DB keyless custody replica

  publish:
    name: Publish manifest
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # New GHCR packages are private. Set this package's visibility to public
    # once (Package settings), or the cluster cannot pull it anonymously.
    steps:
      # GHCR on GitHub; the instance's own container registry on Gitea.
      - name: Select the registry
        run: |
          if [ "${GITHUB_SERVER_URL}" = https://github.com ]; then
            registry=ghcr.io
          else
            registry="${GITHUB_SERVER_URL#*://}"
          fi
          echo "REGISTRY=${registry}" >> "$GITHUB_ENV"
          echo "IMAGE=${registry}/${NAME}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.server_url == 'https://github.com' && github.actor || github.repository_owner }}
          password: ${{ github.server_url == 'https://github.com' && secrets.GITHUB_TOKEN || secrets.PACKAGE_TOKEN }}

      # Each architecture is a single-platform image, so merge them rather than
      # pushing another index. `main` is the moving tag selfhosted-platform
      # tracks; a release instead adds its version and moving channel tag.
      # `sha-<commit>`, versions and the reported digest are immutable.
      - name: Merge the architecture images
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          if [ -n "${VERSION}" ]; then
            set -- --tag "${IMAGE}:${VERSION}" --tag "${IMAGE}:${CHANNEL}"
          else
            set -- --tag "${IMAGE}:main"
          fi
          docker buildx imagetools create "$@" \
            --tag "${IMAGE}:sha-${GITHUB_SHA}" \
            "${IMAGE}:${GITHUB_SHA}-amd64" \
            "${IMAGE}:${GITHUB_SHA}-arm64"

      - name: Report the manifest digest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="${IMAGE}:sha-${GITHUB_SHA}"
          docker buildx imagetools inspect "${tag}"
          digest="$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "${tag}" | tr -d '"')"
          {
            echo "### Custody peer image"
            echo
            echo "- \`${IMAGE}:${VERSION:-main}\`"
            echo "- digest: \`${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

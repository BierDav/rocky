name: Release

# Publishes a versioned release to the packages and releases of the hosting
# forge, GitHub or Gitea: nightly when shipped code changed, or a manually
# chosen channel. The version is computed from Conventional Commits; see
# docs/releasing.md.

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel; the version number is computed
        type: choice
        options:
          - alpha
          - beta
          - rc
          - stable
          - nightly
        default: alpha

permissions:
  contents: read

# Version numbers are allocated from existing tags, so releases never overlap.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version
    # Any architecture.
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'ubuntu-latest-any-arch' }}
    # Includes waiting for the commit's push checks.
    timeout-minutes: 120
    permissions:
      contents: read
      # Waiting and the shopping gate read the check runs of this commit.
      actions: read
    outputs:
      release: ${{ steps.changes.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    env:
      CHANNEL: ${{ inputs.channel || 'nightly' }}
      GH_TOKEN: ${{ github.token }}
      GH_API_URL: ${{ github.api_url }}
    steps:
      - name: Require the default branch
        if: github.ref_name != github.event.repository.default_branch
        run: |
          echo "::error::Releases are cut from ${{ github.event.repository.default_branch }}, not ${GITHUB_REF_NAME}."
          exit 1

      # git-cliff reads the commit history and tags.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide whether to release
        id: changes
        run: |
          set -euo pipefail
          release=true
          if [ "${CHANNEL}" = nightly ]; then
            latest="$(curl --fail --silent --show-error --location \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              "${GH_API_URL}/repos/${GITHUB_REPOSITORY}/releases?per_page=20" \
              | jq -r '[.[] | select(.draft == false)] | .[0].tag_name // ""')"
            if [ -n "${latest}" ]; then
              release="$(scripts/release/code-changed "${latest}" "${GITHUB_SHA}")"
              if [ "${release}" != true ]; then
                echo "No shipped code changed since ${latest}; no nightly release." >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi
          echo "release=${release}" >> "$GITHUB_OUTPUT"

      # Wait only for the required baseline jobs. Auxiliary jobs may keep
      # running, but never gate a release.
      - name: Wait for the checks of this commit
        if: steps.changes.outputs.release == 'true'
        run: |
          set -euo pipefail
          api() {
            curl --fail --silent --show-error --location \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              "${GH_API_URL}/repos/${GITHUB_REPOSITORY}/$1"
          }
          while :; do
            runs="$(api "actions/runs?head_sha=${GITHUB_SHA}&per_page=50" \
              | jq -r '.workflow_runs[] | select((.path | test("(^|/)check\\.yml(@|$)")) and .event == "push") | .id')"
            pending=false
            for run in ${runs}; do
              state="$(api "actions/runs/${run}/jobs?per_page=100" | jq -r '
                [.jobs[] | select(.name == "lint" or .name == "build" or .name == "check")] as $required |
                if any($required[]; .status == "completed" and .conclusion != "success") then "failed"
                elif ($required | length) < 3 or any($required[]; .status != "completed") then "pending"
                else "passed" end')"
              if [ "${state}" = failed ]; then
                echo "::error::A required check failed for ${GITHUB_SHA} in run ${run}."
                exit 1
              fi
              if [ "${state}" = pending ]; then
                pending=true
              fi
            done
            [ "${pending}" = true ] || break
            echo "Waiting for required checks of ${GITHUB_SHA}"
            sleep 30
          done

      - uses: taiki-e/install-action@v2
        if: steps.changes.outputs.release == 'true'
        with:
          tool: git-cliff@2.14.2

      - name: Compute the version and notes
        id: version
        if: steps.changes.outputs.release == 'true'
        run: |
          set -euo pipefail
          version="$(git tag --list 'v*' | scripts/release/version "${CHANNEL}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_SERVER_URL}" = https://github.com ]; then
            registry=ghcr.io
            maven="https://maven.pkg.github.com/${GITHUB_REPOSITORY}"
          else
            registry="${GITHUB_SERVER_URL#*://}"
            maven="${GITHUB_SERVER_URL}/api/packages/${GITHUB_REPOSITORY_OWNER}/maven"
          fi
          if [ "${CHANNEL}" = stable ]; then echo channel=latest; else echo "channel=${CHANNEL}"; fi >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/notes"
          {
            git-cliff --unreleased --tag "v${version}" --strip all
            echo
            echo "### Packages"
            echo
            echo "- \`${registry}/bierdav/rocky-db-coordinator:${version}\`"
            echo "- \`${registry}/bierdav/rocky-db-peer:${version}\`"
            echo "- Maven \`${maven}\`: \`rocky:rocky-core-jvm\`,"
            echo "  \`rocky:rocky-core-android\`, \`rocky:rocky-sqlite\`, \`rocky:rocky-room\` and"
            echo "  \`rocky:rocky-runtime-android\`, version \`${version}\`"
          } > "$RUNNER_TEMP/notes/notes.md"
          { echo "## v${version}"; echo; cat "$RUNNER_TEMP/notes/notes.md"; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.release == 'true'
        with:
          name: notes
          path: ${{ runner.temp }}/notes

  check:
    name: Checks
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/check.yml
    with:
      release: true

  image:
    name: Image ${{ matrix.image }} ${{ matrix.arch }}
    # After the checks, so an image of a failing commit is never pushed.
    needs: [version, check]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Native runners, not QEMU: a release build of a Rust workspace under
        # emulation is many times slower than the hosted arm64 runner.
        # Deployments are described in docs/runtime/coordinator-operations.md
        # and docs/runtime/always-on-peer.md.
        include:
          - image: coordinator
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            package: rocky-db-coordinator
            dockerfile: crates/rocky-coordinator/Dockerfile
            title: rocky-voter
            description: Rocky DB public coordination voter
          - image: coordinator
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            package: rocky-db-coordinator
            dockerfile: crates/rocky-coordinator/Dockerfile
            title: rocky-voter
            description: Rocky DB public coordination voter
          - image: peer
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            package: rocky-db-peer
            dockerfile: crates/rocky-sdk/Dockerfile
            title: rocky-peer
            description: Rocky DB keyless custody replica
          - image: peer
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            package: rocky-db-peer
            dockerfile: crates/rocky-sdk/Dockerfile
            title: rocky-peer
            description: Rocky DB keyless custody replica
    steps:
      - name: Download the exact source revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REVISION: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --output "$RUNNER_TEMP/source.tar.gz" \
            "${GH_API_URL}/repos/${GH_REPOSITORY}/tarball/${GH_REVISION}"
          mkdir source
          tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C source

      # GHCR on GitHub; the instance's own container registry on Gitea.
      - name: Select the registry
        run: |
          if [ "${GITHUB_SERVER_URL}" = https://github.com ]; then
            registry=ghcr.io
          else
            registry="${GITHUB_SERVER_URL#*://}"
          fi
          echo "REGISTRY=${registry}" >> "$GITHUB_ENV"
          # Registries require a lowercase repository name; `github.repository_owner`
          # is `BierDav` on GitHub, which Docker rejects in a tag.
          echo "IMAGE=${registry}/bierdav/${{ matrix.package }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.server_url == 'https://github.com' && github.actor || github.repository_owner }}
          password: ${{ github.server_url == 'https://github.com' && secrets.GITHUB_TOKEN || secrets.PACKAGE_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: source
          file: source/${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
          # Gitea's cache server may not serve BuildKit; a cold build still works.
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }},ignore-error=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}

  image-manifest:
    name: Publish the ${{ matrix.image }} manifest
    needs: [version, image]
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'ubuntu-latest-any-arch' }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # New GHCR packages are private. The coordinator stays private and its
        # deployment supplies a ghcr-pull registry secret; set the peer package's
        # visibility to public once, or the cluster cannot pull it anonymously.
        include:
          - image: coordinator
            package: rocky-db-coordinator
            heading: Coordinator image
          - image: peer
            package: rocky-db-peer
            heading: Custody peer image
    steps:
      # GHCR on GitHub; the instance's own container registry on Gitea.
      - name: Select the registry
        run: |
          if [ "${GITHUB_SERVER_URL}" = https://github.com ]; then
            registry=ghcr.io
          else
            registry="${GITHUB_SERVER_URL#*://}"
          fi
          echo "REGISTRY=${registry}" >> "$GITHUB_ENV"
          # Registries require a lowercase repository name; `github.repository_owner`
          # is `BierDav` on GitHub, which Docker rejects in a tag.
          echo "IMAGE=${registry}/bierdav/${{ matrix.package }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.server_url == 'https://github.com' && github.actor || github.repository_owner }}
          password: ${{ github.server_url == 'https://github.com' && secrets.GITHUB_TOKEN || secrets.PACKAGE_TOKEN }}

      # Each architecture is a single-platform image, so merge them rather than
      # pushing another index, tagged with the version and the moving channel tag.
      # `sha-<commit>`, versions and the reported digest are immutable.
      - name: Merge the architecture images
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" --tag "${IMAGE}:${CHANNEL}" \
            --tag "${IMAGE}:sha-${GITHUB_SHA}" \
            "${IMAGE}:${GITHUB_SHA}-amd64" \
            "${IMAGE}:${GITHUB_SHA}-arm64"

      - name: Report the manifest digest
        env:
          VERSION: ${{ needs.version.outputs.version }}
          HEADING: ${{ matrix.heading }}
        run: |
          set -euo pipefail
          tag="${IMAGE}:sha-${GITHUB_SHA}"
          docker buildx imagetools inspect "${tag}"
          digest="$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "${tag}" | tr -d '"')"
          {
            echo "### ${HEADING}"
            echo
            echo "- \`${IMAGE}:${VERSION}\`"
            echo "- digest: \`${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  jvm:
    name: JVM SDK ${{ matrix.platform }}
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          # The qualified JVM targets of docs/runtime/sdk-packaging.md.
          - platform: darwin-aarch64
            runner: macos-latest
          - platform: linux-x86-64
            runner: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # The Gitea macOS runner is a service without a login environment.
      - name: Use the Gitea runner's tools
        if: github.server_url != 'https://github.com' && runner.os == 'macOS'
        run: |
          echo "CARGO_HOME=/Users/gitea-runner/.cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=/Users/gitea-runner/.rustup" >> "$GITHUB_ENV"
          printf '%s\n' /opt/homebrew/bin /Users/gitea-runner/node/bin /Users/gitea-runner/.cargo/bin >> "$GITHUB_PATH"

      - name: Download the exact source revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REVISION: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --output "$RUNNER_TEMP/source.tar.gz" \
            "${GH_API_URL}/repos/${GH_REPOSITORY}/tarball/${GH_REVISION}"
          mkdir source
          tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C source

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the system build dependencies
        working-directory: source
        run: ./scripts/ci/install-system-deps

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - name: Package and qualify the SDK
        working-directory: source
        run: ./kotlin check packaged -m packaged-consumer

      - name: Collect the package
        working-directory: source
        run: |
          set -euo pipefail
          mkdir dist
          cp local/packaged-sdk/lib/rocky-core-jvm.jar dist/
          tar -czf "dist/rocky-kotlin-sdk-${VERSION}-${{ matrix.platform }}.tar.gz" -C local packaged-sdk

      - uses: actions/upload-artifact@v4
        with:
          name: jvm-${{ matrix.platform }}
          path: source/dist

  android:
    name: Android SDK
    needs: version
    if: needs.version.outputs.release == 'true'
    # x64: the Android NDK has no Linux arm64 host build.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Download the exact source revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REVISION: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --output "$RUNNER_TEMP/source.tar.gz" \
            "${GH_API_URL}/repos/${GH_REPOSITORY}/tarball/${GH_REVISION}"
          mkdir source
          tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C source

      # The same caches the baseline `android` job keeps warm on main; the
      # keys must stay identical to its save steps (docs/development.md#ci).
      - name: Restore the Android toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle
            ~/.cache/JetBrains/Kotlin
          key: android-tooling-${{ runner.os }}-${{ hashFiles('source/sdks/kotlin/**/*.gradle.kts', 'source/sdks/kotlin/**/*.properties', 'source/sdks/kotlin/**/*.yaml', 'source/project.yaml', 'source/project.module-template.yaml', 'source/kotlin') }}
          restore-keys: |
            android-tooling-${{ runner.os }}-

      - name: Restore the Android native cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            source/sdks/native/target
          key: android-native-${{ runner.os }}-${{ hashFiles('source/sdks/native/Cargo.lock', 'source/rust-toolchain.toml', 'source/sdks/kotlin/tooling/build-logic/src/Android.kt') }}
          restore-keys: |
            android-native-${{ runner.os }}-

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Gitea's runner image has no Android SDK.
      - uses: android-actions/setup-android@v3
        if: github.server_url != 'https://github.com'
        with:
          packages: ""

      # The versions docs/runtime/android.md names.
      # The NDK download is large and occasionally truncated; GitHub's image has
      # an SDK already.
      - name: Cache the Android platform and NDK
        if: github.server_url != 'https://github.com'
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-35
            ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          key: android-sdk-${{ runner.os }}-35-ndk-28.2.13676358

      - name: Install the Android platform and NDK
        run: |
          set -euo pipefail
          sdkmanager="$(command -v sdkmanager || echo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager")"
          yes | "${sdkmanager}" --licenses > /dev/null || true
          for attempt in 1 2 3; do
            "${sdkmanager}" --install "platforms;android-35" "ndk;28.2.13676358" && break
            [ "${attempt}" -lt 3 ] || exit 1
          done
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install the system build dependencies
        working-directory: source
        run: ./scripts/ci/install-system-deps

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      # Maven local keeps the development version the toolchain verifies; the
      # staging repository holds the release version.
      - name: Build the Android runtime
        working-directory: source
        run: |
          set -euo pipefail
          sdks/kotlin/android-runtime/gradlew -p sdks/kotlin/android-runtime publishToMavenLocal
          sdks/kotlin/android-runtime/gradlew -p sdks/kotlin/android-runtime \
            -ProckyVersion="${VERSION}" publishReleasePublicationToStagingRepository

      - name: Package the Android SDK
        working-directory: source
        env:
          ROCKY_VERSION: ${{ needs.version.outputs.version }}
        run: |
          # shellcheck disable=SC1010 # `do` is the toolchain's command
          ./kotlin do packageAndroid -m rocky-runtime-android

      # Saved on success only; the keys must stay identical to the restore
      # steps above and to the baseline `android` job.
      - name: Save the Android toolchain cache
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle
            ~/.cache/JetBrains/Kotlin
          key: android-tooling-${{ runner.os }}-${{ hashFiles('source/sdks/kotlin/**/*.gradle.kts', 'source/sdks/kotlin/**/*.properties', 'source/sdks/kotlin/**/*.yaml', 'source/project.yaml', 'source/project.module-template.yaml', 'source/kotlin') }}

      - name: Save the Android native cache
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            source/sdks/native/target
          key: android-native-${{ runner.os }}-${{ hashFiles('source/sdks/native/Cargo.lock', 'source/rust-toolchain.toml', 'source/sdks/kotlin/tooling/build-logic/src/Android.kt') }}

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            source/local/release-maven
            source/local/packaged-android/maven

  ios:
    name: iOS SDK
    needs: [version, check]
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      ROCKY_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Download the exact source revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REVISION: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --output "$RUNNER_TEMP/source.tar.gz" \
            "${GH_API_URL}/repos/${GH_REPOSITORY}/tarball/${GH_REVISION}"
          mkdir source
          tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C source

      - name: Install the pinned iOS toolchain
        working-directory: source
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
          rustup target add --toolchain "$toolchain" aarch64-apple-ios aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/sdks/native -> target
          shared-key: ios

      - name: Package and qualify the versioned iOS SDK
        working-directory: source
        run: |
          set -euo pipefail
          ./sdks/kotlin/package-ios
          ./sdks/native/qualify-ios-package
          mkdir -p dist
          tar -czf "dist/rocky-kotlin-sdk-${ROCKY_VERSION}-ios.tar.gz" -C local packaged-ios

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: |
            source/local/packaged-ios/maven
            source/dist/rocky-kotlin-sdk-*-ios.tar.gz

  publish:
    name: Publish
    needs: [version, check, image-manifest, jvm, android, ios]
    # Any architecture.
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'ubuntu-latest-any-arch' }}
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      # `gh run download` reads the artifacts of this run.
      actions: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the exact source revision
        env:
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REVISION: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --output "$RUNNER_TEMP/source.tar.gz" \
            "${GH_API_URL}/repos/${GH_REPOSITORY}/tarball/${GH_REVISION}"
          mkdir source
          tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C source

      # Only what publishing consumes: the notes, the two JVM packages and the
      # Android repository. The image jobs' Docker build records are not
      # release inputs, and fetching every artifact once died on one of them
      # after five retries (run 37939385427); retry the fetch instead of
      # re-running the whole workflow.
      - name: Download the release artifacts
        if: github.server_url == 'https://github.com'
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            rm -rf dist
            if gh run download "${GITHUB_RUN_ID}" --dir dist \
                --pattern 'notes' --pattern 'android' --pattern 'ios' --pattern 'jvm-*' &&
              test -f dist/notes/notes.md; then
              exit 0
            fi
            echo "::warning::Downloading the release artifacts failed (attempt ${attempt})"
            sleep $((attempt * 15))
          done
          exit 1

      # Gitea has no `gh`; the same layout as `gh run download`.
      - uses: actions/download-artifact@v4
        if: github.server_url != 'https://github.com'
        with:
          name: notes
          path: dist/notes

      - uses: actions/download-artifact@v4
        if: github.server_url != 'https://github.com'
        with:
          name: android
          path: dist/android

      - uses: actions/download-artifact@v4
        if: github.server_url != 'https://github.com'
        with:
          pattern: jvm-*
          path: dist

      - uses: actions/download-artifact@v4
        if: github.server_url != 'https://github.com'
        with:
          name: ios
          path: dist/ios

      - name: Publish the Maven artifacts
        env:
          MAVEN_USER: ${{ github.server_url == 'https://github.com' && github.actor || github.repository_owner }}
          MAVEN_TOKEN: ${{ github.server_url == 'https://github.com' && github.token || secrets.PACKAGE_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_SERVER_URL}" = https://github.com ]; then
            export MAVEN_URL="https://maven.pkg.github.com/${GITHUB_REPOSITORY}"
          else
            export MAVEN_URL="${GITHUB_SERVER_URL}/api/packages/${GITHUB_REPOSITORY_OWNER}/maven"
          fi
          source/scripts/release/jvm-maven "${VERSION}" dist/maven-jvm \
            dist/jvm-darwin-aarch64/rocky-core-jvm.jar dist/jvm-linux-x86-64/rocky-core-jvm.jar
          source/scripts/release/maven-deploy dist/maven-jvm \
            dist/android/release-maven dist/android/packaged-android/maven dist/ios/local/packaged-ios/maven

      - name: Create the GitHub release
        if: github.server_url == 'https://github.com'
        run: |
          set -euo pipefail
          if [ "${CHANNEL}" = latest ]; then
            set -- --latest
          else
            set -- --prerelease --latest=false
          fi
          gh release create "v${VERSION}" "$@" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --notes-file dist/notes/notes.md \
            dist/jvm-*/rocky-kotlin-sdk-*.tar.gz dist/ios/dist/rocky-kotlin-sdk-*-ios.tar.gz

      - name: Create the Gitea release
        if: github.server_url != 'https://github.com'
        env:
          GH_API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          api() {
            curl --fail --silent --show-error --location \
              --header "Authorization: token ${GH_TOKEN}" "$@"
          }
          prerelease="$([ "${CHANNEL}" = latest ] && echo false || echo true)"
          payload="$(jq -n \
            --arg tag "v${VERSION}" \
            --arg target "${GITHUB_SHA}" \
            --rawfile body dist/notes/notes.md \
            --argjson prerelease "${prerelease}" \
            '{tag_name: $tag, target_commitish: $target, name: $tag, body: $body, draft: false, prerelease: $prerelease}')"
          id="$(api --request POST --header 'Content-Type: application/json' --data "${payload}" \
            "${GH_API_URL}/repos/${GITHUB_REPOSITORY}/releases" | jq -r .id)"
          for asset in dist/jvm-*/rocky-kotlin-sdk-*.tar.gz dist/ios/dist/rocky-kotlin-sdk-*-ios.tar.gz; do
            api --request POST --form "attachment=@${asset}" \
              "${GH_API_URL}/repos/${GITHUB_REPOSITORY}/releases/${id}/assets?name=$(basename "${asset}")" > /dev/null
          done

      # Nightly releases and tags are kept for two weeks of builds; their
      # package versions stay in the package registry.
      - name: Prune old nightly GitHub releases
        if: github.server_url == 'https://github.com' && needs.version.outputs.channel == 'nightly'
        run: |
          set -euo pipefail
          gh release list --repo "${GITHUB_REPOSITORY}" --limit 1000 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("-nightly\\."))] | sort_by(.createdAt) | reverse | .[14:] | .[].tagName' \
          | while read -r tag; do
              gh release delete "${tag}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes
            done

      - name: Prune old nightly Gitea releases
        if: github.server_url != 'https://github.com' && needs.version.outputs.channel == 'nightly'
        env:
          GH_API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          api() {
            curl --fail --silent --show-error --location \
              --header "Authorization: token ${GH_TOKEN}" "$@"
          }
          page=1
          : > "$RUNNER_TEMP/releases"
          while :; do
            api "${GH_API_URL}/repos/${GITHUB_REPOSITORY}/releases?per_page=50&page=${page}" > "$RUNNER_TEMP/page"
            [ "$(jq length "$RUNNER_TEMP/page")" -gt 0 ] || break
            jq -c '.[]' "$RUNNER_TEMP/page" >> "$RUNNER_TEMP/releases"
            page=$((page + 1))
          done
          jq -rs '[.[] | select(.tag_name | test("-nightly\\."))] | sort_by(.created_at) | reverse | .[14:] | .[].tag_name' \
            "$RUNNER_TEMP/releases" \
          | while read -r tag; do
              api --request DELETE "${GH_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}"
              api --request DELETE "${GH_API_URL}/repos/${GITHUB_REPOSITORY}/tags/${tag}"
            done

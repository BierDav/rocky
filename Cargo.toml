[workspace]
members = ["crates/*", "examples/*", "benchmarks/runtime-scaling"]
exclude = ["benchmarks/engine-comparison", "benchmarks/engine-scale", "examples/market-app", "examples/pairing-ui", "examples/shoppinglist-app", "sdks/native", "vendor/apple-libc", "vendor/netdev", "vendor/netwatch"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
rocky-core = { path = "crates/rocky-core" }
rocky-credentials = { path = "crates/rocky-credentials" }
rocky-runtime = { path = "crates/rocky-runtime" }
rocky-secure = { path = "crates/rocky-secure" }
rocky-storage = { path = "crates/rocky-storage" }
rocky-coordinator = { path = "crates/rocky-coordinator" }
rocky-iroh = { path = "crates/rocky-iroh" }
todo-app = { path = "examples/todo-app" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"

# Crypto and SQLite dominate test time; optimize dependencies. Generic code
# such as encoding is compiled in the crate that uses it, so the crates
# that encode most are optimized as well; decision 0060 has the measurements.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.rocky-core]
opt-level = 1

[profile.dev.package.rocky-credentials]
opt-level = 1

[profile.dev.package.rocky-secure]
opt-level = 3

[patch.crates-io]
netdev = { path = "vendor/netdev" }
netwatch = { path = "vendor/netwatch" }

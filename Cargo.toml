[workspace]
members = ["crates/*", "examples/*", "benchmarks/runtime-scaling"]
exclude = ["benchmarks/engine-comparison", "benchmarks/engine-scale",  "examples/shoppinglist-app", "sdks/native", "vendor/apple-libc", "vendor/netdev", "vendor/netwatch"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace.dependencies]
rocky-core = { path = "crates/rocky-core" }
rocky-credentials = { path = "crates/rocky-credentials" }
rocky-runtime = { path = "crates/rocky-runtime" }
rocky-secure = { path = "crates/rocky-secure" }
rocky-storage = { path = "crates/rocky-storage" }
rocky-coordinator = { path = "crates/rocky-coordinator" }
rocky-iroh = { path = "crates/rocky-iroh" }
todo-app = { path = "examples/todo-app" }
# Structured spans and events; Rocky crates never install a subscriber.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["registry", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"

# Development artifacts keep only line-table debug info and no incremental
# state. Full debug info was ~89% of a typical optimized rlib's bytes, and the
# per-workspace incremental cache reached tens of gigabytes, which multiplied
# across worktrees. Restore either for a debugging session with
# CARGO_PROFILE_DEV_DEBUG=2 or CARGO_INCREMENTAL=1.
[profile.dev]
debug = "line-tables-only"
incremental = false

# Crypto and SQLite dominate test time; optimize dependencies. Generic code
# such as encoding is compiled in the crate that uses it, so the crates
# that encode most are optimized as well; decision 0060 has the measurements.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.rocky-core]
opt-level = 1

[profile.dev.package.rocky-credentials]
opt-level = 1

[profile.dev.package.rocky-secure]
opt-level = 3

[profile.dev.package.rocky-sdk]
opt-level = 1

[profile.dev.package.rocky-coordinator]
opt-level = 1

[patch.crates-io]
netdev = { path = "vendor/netdev" }
netwatch = { path = "vendor/netwatch" }

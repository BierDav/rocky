[workspace]
members = ["crates/*", "examples/*", "vendor/rocky-sqlite", "vendor/rocky-sqlite-opfs"]
exclude = ["benchmarks/engine-comparison", "benchmarks/engine-scale", "vendor/apple-libc", "vendor/netdev", "vendor/netwatch"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "PolyForm-Noncommercial-1.0.0"
license-file = "LICENSE"
repository = "https://github.com/BierDav/rocky"
publish = false

[workspace.dependencies]
rocky-core = { path = "crates/rocky-core", version = "=0.1.0" }
rocky-credentials = { path = "crates/rocky-credentials", version = "=0.1.0" }
rocky-secure = { path = "crates/rocky-secure", version = "=0.1.0" }
rocky-sdk = { path = "crates/rocky-sdk", version = "=0.1.0" }
rocky-storage = { path = "crates/rocky-storage", version = "=0.1.0" }
rocky-coordinator = { path = "crates/rocky-coordinator", version = "=0.1.0", default-features = false }
rocky-voter = { path = "crates/rocky-voter" }
rocky-iroh = { path = "crates/rocky-iroh", version = "=0.1.0" }
rocky-tcp = { path = "crates/rocky-tcp", version = "=0.1.0" }
rocky-platform = { path = "crates/rocky-platform", version = "=0.1.0" }
rocky-sqlite = { path = "vendor/rocky-sqlite", version = "=0.1.0" }
rocky-sqlite-opfs = { path = "vendor/rocky-sqlite-opfs", version = "=0.1.0" }
# Features only: rocky-sqlite picks the SQLite build on each target.
rusqlite = { version = "=0.40.2", default-features = false, features = ["cache"] }
todo-app = { path = "examples/todo-app" }
# Structured spans and events; Rocky crates never install a subscriber.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["registry", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unfulfilled_lint_expectations = "deny"
# The simulation seeds tokio's own randomness when built with it.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"

# Development artifacts keep only line-table debug info and no incremental
# state. Full debug info was ~89% of a typical optimized rlib's bytes, and the
# per-workspace incremental cache reached tens of gigabytes, which multiplied
# across worktrees. Restore either for a debugging session with
# CARGO_PROFILE_DEV_DEBUG=2 or CARGO_INCREMENTAL=1.
[profile.dev]
debug = "line-tables-only"
incremental = false

# Crypto and SQLite dominate test time; optimize dependencies. Generic code
# such as encoding is compiled in the crate that uses it, so the small crates
# that encode most are optimized as well. The large workspace crates stay
# unoptimized: optimizing rocky-secure's tests alone took 1665 s of CPU at
# opt-level 3 or 1 and 62 s at 0.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.rocky-core]
opt-level = 3

[profile.dev.package.rocky-credentials]
opt-level = 3

[patch.crates-io]
netdev = { path = "vendor/netdev" }
netwatch = { path = "vendor/netwatch" }

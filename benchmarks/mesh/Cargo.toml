[package]
name = "rocky-mesh-bench"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
rocky-sdk = { path = "../../crates/rocky-sdk" }
rocky-iroh = { path = "../../crates/rocky-iroh" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "=0.8.8"
cpu-time = "1"
memory-stats = "1"

[patch.crates-io]
netdev = { path = "../../vendor/netdev" }
netwatch = { path = "../../vendor/netwatch" }

[profile.release]
debug = "line-tables-only"

[lints.rust]
unsafe_code = "forbid"
unfulfilled_lint_expectations = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

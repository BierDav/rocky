# git-cliff configuration: the next version and release notes from
# Conventional Commits; see docs/releasing.md.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}**breaking:** {% endif %}\
{{ commit.message | split(pat="\n") | first | trim }} ({{ commit.id | truncate(length=8, end="") }})\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^revert", group = "<!-- 4 -->Reverts" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^(build|ci)", group = "<!-- 6 -->Build and CI" },
  { message = "^(test|style|chore)", group = "<!-- 7 -->Maintenance" },
]
# Versions count from the last stable release; prereleases accumulate onto it.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"

[bump]
# Cargo's 0.x convention: a breaking change bumps the minor version, anything else the patch.
features_always_bump_minor = false
breaking_always_bump_major = false
initial_tag = "v0.1.0"

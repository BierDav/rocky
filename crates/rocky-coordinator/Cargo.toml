[package]
name = "rocky-coordinator"
description = "Gap-free counters and at-most-once admission for Rocky databases, and the coordinator protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
repository.workspace = true
license-file.workspace = true

[features]
default = ["database"]
database = ["dep:rocky-sdk", "dep:rocky-iroh"]
voter = []

# The protocol, the state machine and the client, on every target.
[dependencies]
tracing.workspace = true
rocky-core.workspace = true
rocky-credentials.workspace = true
rocky-platform.workspace = true
rocky-sdk = { workspace = true, optional = true }
rocky-iroh = { workspace = true, optional = true }
p2panda-core = "=0.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "sync"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1", features = ["net", "time"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
rocky-iroh.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }

[[example]]
name = "counters"
required-features = ["database"]

[dev-dependencies]
rocky-coordinator = { path = ".", features = ["voter"] }
rocky-credentials = { workspace = true, features = ["test-support"] }
# Each pure test also runs in a browser on wasm32 (`wasm_bindgen_test(unsupported = ...)`).
wasm-bindgen-test = "0.3"
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true

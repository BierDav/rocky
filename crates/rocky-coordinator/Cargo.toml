[package]
name = "rocky-coordinator"
description = "Generic execution fencing, head confirmation and request deduplication"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
repository.workspace = true
license-file.workspace = true

[features]
default = ["iroh"]
# Certified iroh client endpoints.
iroh = ["dep:rocky-iroh"]

# The protocol, the state machine and the client, on every target.
[dependencies]
tracing.workspace = true
rocky-core.workspace = true
rocky-iroh = { workspace = true, optional = true }
rocky-credentials.workspace = true
rocky-platform.workspace = true
p2panda-core = "=0.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "sync"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1", features = ["net", "time"] }

[dev-dependencies]
rocky-credentials = { workspace = true, features = ["test-support"] }
# Each pure test also runs in a browser on wasm32 (`wasm_bindgen_test(unsupported = ...)`).
wasm-bindgen-test = "0.3"
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true

[package]
name = "rocky-coordinator"
description = "Generic execution fencing, head confirmation and request deduplication"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
repository.workspace = true
license-file.workspace = true

[features]
default = ["iroh"]
# The voter's iroh client lane and the setup commands that certify it.
iroh = ["dep:rocky-iroh"]
# Packaged relay process, deployed behind an HTTPS reverse proxy.
relay-server = ["iroh", "dep:iroh-relay"]

# The protocol, the state machine and the client, on every target.
[dependencies]
tracing.workspace = true
rocky-core.workspace = true
rocky-iroh = { workspace = true, optional = true }
rocky-credentials.workspace = true
rocky-platform.workspace = true
p2panda-core = "=0.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "sync"] }

# The voter: Raft, its file store and sockets.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
openraft = { version = "=0.9.21", features = ["serde", "storage-v2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
fs2 = "0.4"
iroh-relay = { version = "=1.3.0", optional = true, features = ["server"] }

[dev-dependencies]
# Each pure test also runs in a browser on wasm32 (`wasm_bindgen_test(unsupported = ...)`).
wasm-bindgen-test = "0.3"
tokio = { version = "1", features = ["macros", "rt"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tempfile = "3"
rocky-runtime = { path = "../rocky-runtime" }
rocky-secure = { path = "../rocky-secure" }
directory-app = { path = "../../examples/directory-app" }
inventory-app = { path = "../../examples/inventory-app" }

[lints]
workspace = true

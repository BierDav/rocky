[package]
name = "rocky-core"
description = "Shared Rocky identities, schema definitions, manifests and protocol errors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
repository.workspace = true
license-file.workspace = true

[lints]
workspace = true

[features]
# Deterministic simulator fault hooks; never enabled in published artifacts.
qualification = []

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
# The `AsyncRead`/`AsyncWrite` traits and connectivity `watch` of the network port.
tokio = { version = "1", default-features = false, features = ["sync", "io-util"] }

[target.'cfg(all(target_arch = "aarch64", target_endian = "little", any(target_vendor = "apple", target_os = "linux", target_os = "android")))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[dev-dependencies]
# Each test also runs in a browser on wasm32 (`wasm_bindgen_test(unsupported = ...)`).
wasm-bindgen-test = "0.3"
# Checks that byte arrays encode as CBOR byte strings.
ciborium = "0.2"

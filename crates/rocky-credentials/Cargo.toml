[package]
name = "rocky-credentials"
description = "Signed manifests, capabilities and revocations, identities, key providers, issuance and enrollment messages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rocky-core.workspace = true
p2panda-core = "=0.5.2"
serde = { version = "1", features = ["derive"] }
chacha20poly1305 = "=0.10.1"
# X25519 for sealing renewed keys to a device and a pseudonym's device to
# the publisher, whose scalar comes from its Ed25519 seed by SHA-512.
curve25519-dalek = "=4.1.3"
rand = "=0.8.8"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[lints]
workspace = true

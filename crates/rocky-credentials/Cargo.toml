[package]
name = "rocky-credentials"
description = "Signed manifests, capabilities and revocations, identities, key providers, issuance and enrollment messages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
repository.workspace = true
license-file.workspace = true

[dependencies]
rocky-core.workspace = true
rocky-platform.workspace = true
p2panda-core = "=0.5.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
chacha20poly1305 = "=0.10.1"
# X25519 for sealing renewed keys to a device.
curve25519-dalek = "=4.1.3"
rand = "=0.8.8"
sha2 = "0.10"
# The root key's 24-word backup phrase (BIP 39, English).
bip39 = { version = "=2.2.2", default-features = false }

# Browsers supply randomness through `crypto.getRandomValues`.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
rocky-platform = { workspace = true, features = ["test-support"] }
tokio = { version = "1", features = ["macros", "rt"] }
# Each test also runs in a browser on wasm32 (`wasm_bindgen_test(unsupported = ...)`).
wasm-bindgen-test = "0.3"
serde_json = "1"

[lints]
workspace = true

[package]
name = "rocky-iroh"
description = "Rocky's network port on iroh: handlers for an application's router and a starter endpoint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Deterministic simulator fault hooks; never enabled in published artifacts.
qualification = ["rocky-core/qualification"]

[dependencies]
rocky-core.workspace = true
iroh = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "io-util", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true

[package]
name = "rocky-iroh"
description = "Rocky's network port on iroh: handlers for an application's router and a starter endpoint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Deterministic simulator fault hooks; never enabled in published artifacts.
qualification = ["rocky-core/qualification"]
# A local relay and lookup server for checks; never in published artifacts.
test-utils = ["iroh/test-utils"]

[dependencies]
rocky-core.workspace = true
iroh = "1.3"
iroh-dns = "1.3"
n0-error = "1"
# The local-network path; see docs/decisions/0057-discovery.md.
iroh-mdns-address-lookup = "0.6"
chacha20poly1305 = "=0.10.1"
data-encoding = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rand = "=0.8.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "io-util", "macros", "net"] }

[dev-dependencies]
rocky-iroh = { path = ".", features = ["test-utils"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true

[package]
name = "rocky-peer"
description = "Always-on Rocky custody peer with an iroh harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"
publish = false

[dependencies]
rocky-sdk = { path = "../rocky-sdk" }
rocky-iroh.workspace = true
rocky-coordinator.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "macros"] }

[lints]
workspace = true

[package]
name = "rocky-runtime"
description = "Local transactions, operation storage, replication and observable queries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
repository.workspace = true
license-file.workspace = true

[dependencies]
rocky-core.workspace = true
rocky-storage.workspace = true
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
inventory-app = { path = "../../examples/inventory-app" }
rocky-storage = { path = "../rocky-storage", features = ["test-support"] }
todo-app.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

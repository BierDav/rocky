[package]
name = "rocky-runtime"
description = "Local transactions, operation storage, replication and observable queries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
repository.workspace = true
license-file.workspace = true

[dependencies]
rocky-core.workspace = true
rocky-storage.workspace = true
rocky-platform.workspace = true
# `std::time` natively; the browser clock on wasm32.
web-time = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
inventory-app = { path = "../../examples/inventory-app" }
runtime-todo-app = { path = "../../examples/runtime-todo-app" }
rocky-storage = { path = "../rocky-storage", features = ["test-support"] }
rocky-platform = { workspace = true, features = ["test-support"] }
# Each test also runs in a browser on wasm32 (`wasm_bindgen_test(unsupported = ...)`).
wasm-bindgen-test = "0.3"
tokio = { version = "1", features = ["macros", "rt"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints]
workspace = true

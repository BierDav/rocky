[package]
name = "rocky-secure"
description = "Signed capabilities, encrypted replicas and authenticated live links"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
repository.workspace = true
license-file.workspace = true

[features]
# Deterministic simulator fault hooks; never enabled in published artifacts.
qualification = ["rocky-storage/qualification"]
# Test-only capture of committed SQL transaction shapes; never in published artifacts.
intent-shapes = ["dep:sqlparser", "dep:serde_json"]

[dependencies]
tracing.workspace = true
rocky-core.workspace = true
rocky-credentials.workspace = true
rocky-storage.workspace = true
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "net", "io-util"] }

p2panda-core = "=0.5.2"
p2panda-store = { version = "=0.5.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
chacha20poly1305 = "=0.10.1"
rand = "=0.8.8"
sqlparser = { version = "0.63", default-features = false, features = ["std", "visitor"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
sqlparser = { version = "0.63", default-features = false, features = ["std", "visitor"] }
employees-app = { path = "../../examples/employees-app" }
rocky-coordinator = { path = "../rocky-coordinator" }
rocky-storage = { path = "../rocky-storage", features = ["test-support"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true

[[example]]
name = "intent_shapes"
required-features = ["intent-shapes"]

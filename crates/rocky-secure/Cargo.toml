[package]
name = "rocky-secure"
description = "Signed capabilities, encrypted replicas and authenticated live links"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
repository.workspace = true
license-file.workspace = true

[features]
# Deterministic simulator fault hooks; never enabled in published artifacts.
qualification = ["rocky-storage/qualification"]

[dependencies]
tracing.workspace = true
rocky-core.workspace = true
rocky-credentials.workspace = true
rocky-storage.workspace = true
rocky-platform.workspace = true
# `std::time` natively; the browser clock on wasm32.
web-time = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "io-util"] }

p2panda-core = "=0.5.2"
p2panda-store = { version = "=0.5.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
chacha20poly1305 = "=0.10.1"
rand = "=0.8.8"

[dev-dependencies]
employees-app = { path = "../../examples/employees-app" }
rocky-storage = { path = "../rocky-storage", features = ["test-support"] }
rusqlite.workspace = true
rocky-platform = { workspace = true, features = ["test-support"] }
# Each test also runs in a browser on wasm32 (`wasm_bindgen_test(unsupported = ...)`).
wasm-bindgen-test = "0.3"
tokio = { version = "1", features = ["macros", "rt"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
rocky-coordinator = { path = "../rocky-coordinator" }
tempfile = "3"
tokio = { version = "1", features = ["net", "rt-multi-thread", "test-util"] }

[lints]
workspace = true

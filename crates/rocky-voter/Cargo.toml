[package]
name = "rocky-voter"
description = "Persistent Rocky metadata voter and relay server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license-file.workspace = true

[features]
default = ["server"]
server = ["dep:iroh-relay", "dep:tracing-subscriber"]

[[bin]]
name = "rocky-voter"
path = "src/bin/rocky-voter/main.rs"
required-features = ["server"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rocky-coordinator = { workspace = true, features = ["voter"] }
rocky-core.workspace = true
rocky-iroh.workspace = true
rocky-credentials.workspace = true
tracing.workspace = true
p2panda-core = "=0.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openraft = { version = "=0.9.21", features = ["serde", "storage-v2"] }
iroh-relay = { version = "=1.3.0", features = ["server"], optional = true }
tracing-subscriber = { workspace = true, features = ["fmt"], optional = true }
tokio = { version = "1", features = ["io-util", "sync", "rt-multi-thread", "macros", "net", "signal", "time"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
rocky-coordinator = { workspace = true, features = ["database", "voter"] }
rocky-sdk = { workspace = true, features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true

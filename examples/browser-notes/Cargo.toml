[package]
name = "browser-notes"
description = "A notes app whose Rocky database runs in a browser Worker and syncs over wss://"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_family = "wasm")'.dependencies]
rocky-sdk = { path = "../../crates/rocky-sdk" }
rocky-tcp = { path = "../../crates/rocky-tcp" }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[lints]
workspace = true

# Multi-process shopping qualification: devices run the app's Room repository in separate JVMs and the packaged
# rocky-peer is the custody process. See docs/runtime/shopping-qualification.md.
product: jvm/app
apply:
  - //project.module-template.yaml
dependencies:
  - ../shared
settings:
  jvm:
    mainClass: org.example.examples.shopping.qualification.QualificationKt
  kotlin:
    allWarningsAsErrors: true

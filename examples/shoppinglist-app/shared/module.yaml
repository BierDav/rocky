product:
  type: kmp/lib
  platforms: [jvm, android]
apply:
  - //project.module-template.yaml
dependencies:
  - ../../../sdks/kotlin/rocky-room: exported
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - network.chaintech:qr-kit:3.1.3
settings:
  android:
    minSdk: 26
  compose:
    enabled: true
    resources:
      packageName: org.example.examples.resources
      exposedAccessors: true
  kotlin:
    freeCompilerArgs: [-Xexpect-actual-classes]
    ksp:
      processors:
        - androidx.room:room-compiler:2.8.4
      processorOptions:
        room.schemaLocation: ./schemas

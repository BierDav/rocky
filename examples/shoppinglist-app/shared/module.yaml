product:
  type: kmp/lib
  platforms: [jvm, android, iosArm64, iosSimulatorArm64]
apply:
  - //project.module-template.yaml
dependencies:
  - rocky:rocky-room:0.1.0: exported
  - io.github.vinceglb:filekit-core:0.16.0
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - org.jetbrains.compose.material:material-icons-extended:1.7.3
  - $compose.ui
  - $compose.preview
  - $compose.hotReload.runtimeApi
  # QR display on every target; camera scanning on mobile.
  - io.github.alexzhirkevich:qrose:1.3.1
  # Material 3 colour schemes generated from the brand colour.
  - com.materialkolor:material-kolor:5.0.1
  - dev.zacsweers.metro:runtime:1.4.5: exported
  - dev.zacsweers.metro:metrox-viewmodel-compose:1.4.5: exported
  - org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0: exported
  - org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3:2.11.0
  - org.jetbrains.androidx.navigation3:navigation3-ui:1.1.1
dependencies@mobile:
  - io.github.kalinjul.easyqrscan:scanner:0.7.2
dependencies@android:
  # Permission requests from Compose.
  - androidx.activity:activity-compose:1.13.0
settings:
  android:
    minSdk: 26
  compose:
    enabled: true
  kotlin:
    freeCompilerArgs: [-Xexpect-actual-classes]
    # Navigation keys are serializable so the back stack survives saved-state restoration.
    serialization: enabled
    compilerPlugins:
      - id: dev.zacsweers.metro.compiler
        dependency: dev.zacsweers.metro:compiler:1.4.5
    ksp:
      processors:
        - androidx.room:room-compiler:2.8.4
      processorOptions:
        room.schemaLocation: ./schemas

aliases:
  - jna: [jvm, android]
  - mobile: [android, iosArm64, iosSimulatorArm64]

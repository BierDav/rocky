[package]
name = "todo-app"
description = "Shared, ordered todo lists on Rocky's replayed tables"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rocky-sdk = { path = "../../crates/rocky-sdk" }
serde_json = "1"

[dev-dependencies]
rocky-secure.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

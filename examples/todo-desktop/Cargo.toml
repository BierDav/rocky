[package]
name = "todo-desktop"
default-run = "todo-desktop"
description = "Dioxus todo app on rocky-sdk: a two-device demo and a single-device mode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rocky-runtime.workspace = true
rocky-secure.workspace = true
todo-app.workspace = true
rocky-sdk = { path = "../../crates/rocky-sdk" }
employees-app = { path = "../employees-app" }
rocky-core.workspace = true
dioxus = { version = "=0.7.3", features = ["desktop"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

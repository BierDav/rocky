[package]
name = "todo-desktop"
default-run = "todo-desktop"
description = "Dioxus desktop composition and the two-replica development demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rocky-runtime.workspace = true
rocky-secure.workspace = true
rocky-coordinator.workspace = true
todo-app.workspace = true
employees-app = { path = "../employees-app" }
rocky-core.workspace = true
dioxus = { version = "=0.7.3", features = ["desktop"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"

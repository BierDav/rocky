# The Android check of local-network discovery: one database with the mDNS path on, followed by
# RockyLifecycle, which must hold the Wi-Fi multicast lock in the foreground and release it in the
# background. Run by ../qualify-android-discovery on an emulator; see docs/runtime/discovery.md.
product: android/app
apply:
  - //project.module-template.yaml

dependencies:
  - ../rocky-core
  - ../rocky-runtime-android

settings:
  android:
    namespace: rocky.check.discovery
    applicationId: rocky.check.discovery
    minSdk: 26
    # The ABIs Rocky's Android runtime is built for.
    abiFilters: [arm64-v8a, x86_64]

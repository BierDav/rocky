# The original inventory contract on the legacy process-host transport, and typed-command type errors.
product: jvm/lib
apply:
  - //project.module-template.yaml
dependencies:
  - ../rocky-core
settings:
  jvm:
    release: 17
  kotlin:
    allWarningsAsErrors: true
plugins:
  rocky-qualification:
    enabled: true
    mainClass: rocky.QualificationKt
    prepare: [build, -p, rocky-runtime, --example, sdk_host, --locked]
    rejected:
      fixtures: rejected
      with: [../../../examples/market-app/marketShared/src/MarketCommands.kt]

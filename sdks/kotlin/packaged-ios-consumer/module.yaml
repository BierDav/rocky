# Independent artifact consumer; qualify-ios-package substitutes the repository and version.
product:
  type: kmp/lib
  platforms: [iosArm64, iosSimulatorArm64]
repositories:
  - url: mavenLocal
    id: rockyIos
    resolve: true
dependencies:
  - rocky:rocky-core-ios:ROCKY_IOS_VERSION
  - rocky:rocky-sqlite-ios:ROCKY_IOS_VERSION
  - rocky:rocky-room-ios:ROCKY_IOS_VERSION
settings:
  kotlin:
    version: 2.4.20
test-settings@ios:
  kotlin:
    freeCompilerArgs: [-Xbinary=pagedAllocator=false]

# Standalone simulator executables need an app identity for Keychain access.
test-settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs:
      - -Xbinary=pagedAllocator=false
      - -linker-option
      - -sectcreate
      - -linker-option
      - __TEXT
      - -linker-option
      - __entitlements
      - -linker-option
      - ROCKY_IOS_ENTITLEMENTS_PATH

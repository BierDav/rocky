product:
  type: kmp/lib
  # One Kotlin API over JNA on JVM/Android and cinterop on iOS.
  platforms: [jvm, android, iosArm64, iosSimulatorArm64]
apply:
  - //project.module-template.yaml
dependencies:
  - org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2: exported
  - org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0: exported
dependencies@ios:
  - org.jetbrains.kotlinx:atomicfu:0.31.0
dependencies@jna:
  - net.java.dev.jna:jna:5.18.1
settings:
  kotlin:
    freeCompilerArgs: [-Xexpect-actual-classes]
  # Packaged JVM consumers run on Java 17.
  jvm:
    release: 17
  android:
    minSdk: 26
plugins:
  rocky-native: enabled

aliases:
  - jna: [jvm, android]

# Use per-object allocation when linking an uncached test runtime.
test-settings@ios:
  kotlin:
    freeCompilerArgs: [-Xbinary=pagedAllocator=false]

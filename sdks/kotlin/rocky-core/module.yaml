product:
  type: kmp/lib
  # src/native binds the runtime through JNA on both; src@android adds the Keystore and lifecycle.
  platforms: [jvm, android]
apply:
  - //project.module-template.yaml
dependencies:
  - org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2: exported
  - org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0: exported
  - net.java.dev.jna:jna:5.18.1
settings:
  # Packaged JVM consumers run on Java 17.
  jvm:
    release: 17
  android:
    minSdk: 26
plugins:
  rocky-native: enabled

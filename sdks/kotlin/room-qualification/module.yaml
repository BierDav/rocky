product:
  type: kmp/lib
  platforms: [jvm]
apply:
  - //project.module-template.yaml
dependencies:
  - ../rocky-room
test-dependencies:
  - org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2
  # The reference engine Room runs on in these tests.
  - androidx.sqlite:sqlite-bundled:2.6.2
settings:
  kotlin:
    freeCompilerArgs: [-Xexpect-actual-classes]
    ksp:
      processors:
        - androidx.room:room-compiler:2.8.4
      processorOptions:
        room.schemaLocation: ./schemas

tasks:
  current:
    action: !rocky.build.verifyRuntime
      repositoryRoot: ${project.rootDir}
      rustSources:
        - ${project.rootDir}/Cargo.toml
        - ${project.rootDir}/Cargo.lock
        - ${project.rootDir}/rust-toolchain.toml
        - ${project.rootDir}/crates
        - ${project.rootDir}/sdks/native/Cargo.toml
        - ${project.rootDir}/sdks/native/Cargo.lock
        - ${project.rootDir}/sdks/native/src
      verified: ${taskOutputDir}
  package:
    action: !rocky.build.packageAndroid
      repositoryRoot: ${project.rootDir}
      # The core sources with their generated UniFFI bindings, plus the Android-only sources.
      sources:
        from: ../../rocky-core
        includeGenerated: true
      androidSources: ${project.rootDir}/sdks/kotlin/rocky-core/src@android
      keepRules: ${project.rootDir}/sdks/kotlin/rocky-core/proguard-android.txt
      sqliteSources: ${project.rootDir}/sdks/kotlin/rocky-sqlite/src
      roomSources: ${project.rootDir}/sdks/kotlin/rocky-room/src
      verified: ${tasks.current.action.verified}
      # JVM builds of the public dependencies the POMs name; Room is compiled against its Android AARs.
      dependencies:
        - org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.10.2
        - org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:1.9.0
        - net.java.dev.jna:jna:5.18.1
        - org.jetbrains.kotlin:kotlin-stdlib:2.4.20
      output: ${project.rootDir}/local/packaged-android

# Contributing the (empty) verification output makes every build of the module check the runtime.
generated:
  resources:
    - directory: ${tasks.current.action.verified}
      fragment:
        modifier: "@android"

commands:
  - name: packageAndroid
    performedBy: package

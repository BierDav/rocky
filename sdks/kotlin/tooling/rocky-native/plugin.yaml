tasks:
  bindings:
    action: !rocky.build.generateBindings
      repositoryRoot: ${project.rootDir}
      rustSources:
        - ${project.rootDir}/Cargo.toml
        - ${project.rootDir}/Cargo.lock
        - ${project.rootDir}/rust-toolchain.toml
        - ${project.rootDir}/vendor
        - ${project.rootDir}/crates
        - ${project.rootDir}/sdks/native/Cargo.toml
        - ${project.rootDir}/sdks/native/Cargo.lock
        - ${project.rootDir}/sdks/native/uniffi.toml
        - ${project.rootDir}/sdks/native/src
      common: ${taskOutputDir}/common
      jna: ${taskOutputDir}/jna
      ios: ${taskOutputDir}/ios
      cinterop: ${taskOutputDir}/cinterop
      simulatorDef: ${taskOutputDir}/rocky-simulator.def
      deviceDef: ${taskOutputDir}/rocky-device.def
      resources: ${taskOutputDir}/resources

  iosSimulator:
    action: !rocky.build.buildIosBinding
      repositoryRoot: ${project.rootDir}
      target: aarch64-apple-ios-sim
      definition: ${tasks.bindings.action.simulatorDef}
      rustSources:
        - ${project.rootDir}/Cargo.toml
        - ${project.rootDir}/Cargo.lock
        - ${project.rootDir}/rust-toolchain.toml
        - ${project.rootDir}/vendor
        - ${project.rootDir}/crates
        - ${project.rootDir}/sdks/native/Cargo.toml
        - ${project.rootDir}/sdks/native/Cargo.lock
        - ${project.rootDir}/sdks/native/uniffi.toml
        - ${project.rootDir}/sdks/native/src
        - ${project.rootDir}/sdks/native/qualification/keychain-entitlements.plist
      defFile: ${taskOutputDir}/rocky.def
      library: ${taskOutputDir}/librocky_uniffi.a
  iosDevice:
    action: !rocky.build.buildIosBinding
      repositoryRoot: ${project.rootDir}
      target: aarch64-apple-ios
      definition: ${tasks.bindings.action.deviceDef}
      rustSources:
        - ${project.rootDir}/Cargo.toml
        - ${project.rootDir}/Cargo.lock
        - ${project.rootDir}/rust-toolchain.toml
        - ${project.rootDir}/vendor
        - ${project.rootDir}/crates
        - ${project.rootDir}/sdks/native/Cargo.toml
        - ${project.rootDir}/sdks/native/Cargo.lock
        - ${project.rootDir}/sdks/native/uniffi.toml
        - ${project.rootDir}/sdks/native/src
      defFile: ${taskOutputDir}/rocky.def
      library: ${taskOutputDir}/librocky_uniffi.a

generated:
  sources:
    - directory: ${tasks.bindings.action.common}
    - directory: ${tasks.bindings.action.jna}
      fragment:
        modifier: "@jna"
    - directory: ${tasks.bindings.action.ios}
      fragment:
        modifier: "@ios"
  resources:
    # Android unit tests also run JNA on the host JVM.
    - directory: ${tasks.bindings.action.resources}
      fragment:
        modifier: "@jna"
  cinteropDefinitions:
    - defFile: ${tasks.iosSimulator.action.defFile}
      fragment:
        modifier: "@iosSimulatorArm64"
    - defFile: ${tasks.iosDevice.action.defFile}
      fragment:
        modifier: "@iosArm64"

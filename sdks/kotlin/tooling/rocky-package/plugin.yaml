tasks:
  package:
    action: !rocky.build.packageSdk
      classpath: ${module.runtimeClasspath}
      jar: ${module.jar}
      consumerSource: ${module.rootDir}/src/consumer/Consumer.kt
      mainClass: consumer.ConsumerKt
      output: ${project.rootDir}/local/packaged-sdk
  packaged:
    action: !rocky.build.qualifyPackage
      packaged: ${tasks.package.action.output}
      mainClass: consumer.ConsumerKt
  linux:
    action: !rocky.build.qualifyPackageOnLinux
      repositoryRoot: ${project.rootDir}

commands:
  - name: packageSdk
    performedBy: package
  - name: qualifyPackageOnLinux
    performedBy: linux

checks:
  - packaged

[package]
name = "rocky"
description = "Official Rust SDK for Rocky DB, with secure local storage and optional peer sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
qualification = ["rocky-sdk/qualification"]
default = ["iroh"]
iroh = ["rocky-sdk/iroh"]

[dependencies]
rocky-sdk = { path = "../../crates/rocky-sdk", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"

[lints]
workspace = true

[package]
name = "rocky-discovery-probe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
rocky-core = { path = "../../../../crates/rocky-core" }
rocky-iroh = { path = "../../../../crates/rocky-iroh" }
uniffi = "=0.32.2"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "io-util"] }

[lints.rust]
# UniFFI's generated FFI permits unsafe locally; authored probe code stays denied.
unsafe_code = "deny"

[patch.crates-io]
netdev = { path = "../../../../vendor/netdev" }
netwatch = { path = "../../../../vendor/netwatch" }

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
opt-level = 2
